<style>

  @font-face { font-family: 'Cairo'; font-weight: 900; src: url(vendor/cairo-latin-900.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  .dark { --bg: #071030; --bg2: #13256f; --panel: rgba(12,26,84,.88); --panel2: #0b1a55; --line: #29479b; --text: #f2f5ff; --muted: #a9b8e6;

  /* the show */

  .c3 .fc .no { position: absolute; top: 9px; inset-inline-start: 9px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--gold); color: #13204f; font: 900 13px/22px Cairo, Arial; text-align: center; }
  .c3:hover:not(.open) .cin { transform: translateY(-6px); }
  .c3.dim { opacity: .3; cursor: default; }
  .c3.mine { transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(var(--zoom, 1.12)); z-index: 4; }
  .board { position: relative; }
  .board.skip .c3, .board.skip .cin, .board.skip .banner { transition: none !important; animation: none !important; }
  .banner { position: absolute; inset-inline: 0; bottom: -4px; display: flex; justify-content: center; align-items: baseline; gap: 22px; z-index: 5; pointer-events: none;
    padding: 6px 28px; margin: 0 auto; width: max-content; max-width: 100%; box-sizing: border-box; border-radius: 16px; background: var(--panel2); border: 2px solid var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: bannerIn .45s cubic-bezier(.16,1,.3,1) both; }

  .banner.big.up { background: radial-gradient(circle at 50% 50%, #5a4200, var(--panel2) 70%); }
  .banner.big.down { border-color: var(--bad); background: radial-gradient(circle at 50% 50%, #5c0a12, var(--panel2) 70%); }
  .light .banner.big.up { background: radial-gradient(circle at 50% 50%, #ffe08a, var(--panel2) 70%); }
  .light .banner.big.down { background: radial-gradient(circle at 50% 50%, #ffc9c9, var(--panel2) 70%); }
  @keyframes bannerIn { from { opacity: 0; transform: scale(.7); } }

  .light .c3 .bk { box-shadow: inset 0 0 0 4px rgba(255,255,255,.55), 0 0 0 2px #b27a00, 0 8px 18px rgba(0,0,0,.25); }

  /* long text steps the type down so the choices and the next button always fit above the podiums */
  .show[data-size=m] .q { font-size: 28px; }

  .show[data-size=l] .choice { font-size: 17px; min-height: 54px; padding: 8px 12px; }
  .show[data-size=l] .choice .k, .show[data-size=m] .choice .k { width: 32px; height: 32px; font-size: 17px; }
  .show[data-size=l] .ring, .show[data-size=m] .ring { width: 76px; height: 76px; }
  .show[data-size=l] .ring b, .show[data-size=m] .ring b { font-size: 26px; }
  .show[data-size=l], .show[data-size=m] { gap: 10px; padding-block: 14px; }
  .effect { display: flex; align-items: center; gap: 22px; min-height: 96px; width: 100%; }
  .effect .txt { flex: 0 1 auto; font-size: 20px; line-height: 1.5; }
  .effect .btn { font-size: 20px; min-height: 52px; }
  .effect .title { font-size: 22px; flex: none; }
  .tchips { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .tchip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 24px 10px 16px; min-height: 64px; font-size: 26px; border-radius: 999px; background: var(--panel2); border: 2px solid var(--line); font-weight: bold; }
  .tchip:hover { border-color: var(--gold); }

  /* podiums */
  .podiums { display: flex; gap: 14px; justify-content: center; align-items: flex-end; padding: 0 16px 10px; }
  .pod { position: relative; flex: 1 1 0; max-width: 200px; min-width: 0; padding: 6px 8px 8px; border-radius: 12px 12px 6px 6px; background: var(--panel); border: 2px solid var(--line); border-top: 8px solid var(--tc); display: grid; gap: 2px; justify-items: center; transition: transform .3s, opacity .3s; }
  .pod.cur { border-color: var(--gold); border-top-color: var(--tc); box-shadow: 0 0 0 3px rgba(246,195,67,.35), 0 -10px 40px rgba(246,195,67,.35); transform: translateY(-10px); z-index: 2; }
  .pod.cur::before { content: ''; position: absolute; bottom: 100%; left: 50%; width: 280px; height: 230px; margin-left: -140px; clip-path: polygon(38% 100%, 62% 100%, 100% 0, 0 0); background: linear-gradient(to top, rgba(var(--beam),.26), rgba(var(--beam),0)); pointer-events: none; z-index: -1; }

  .pod.hit { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both, flashBad .9s ease-out both; }
  @keyframes flashBad { 0%, 30% { background: rgba(255,90,95,.55); } }

    font-size: 16px; font-weight: 900; color: var(--text); animation: blockIn 1.6s cubic-bezier(.16,1,.3,1) both; pointer-events: none; }
  .pod .blocked span { display: flex; background: var(--face); border-radius: 50%; padding: 6px; }
  @keyframes blockIn { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .pod .nm { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 17px; }
  .pod .sc { font-size: 40px; font-weight: 900; color: var(--text); line-height: 1.1; }
  .pod .sc.neg { color: var(--bad); }
  .pod .inv { display: flex; gap: 4px; margin-top: 2px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .mini { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 8px 0 4px; border-radius: 8px; background: var(--face); color: #13204f; border: 2px solid var(--gold); font-size: 15px; font-weight: 900; white-space: nowrap; }
  .mini svg { flex: none; }
  .mini.use { cursor: pointer; animation: glow 1.4s ease-in-out infinite; }
  .mini:disabled { opacity: 1; cursor: default; }
  @keyframes glow { 50% { box-shadow: 0 0 12px 3px rgba(246,195,67,.9); } }
  .bench { align-self: stretch; text-align: center; font-size: 16px; font-weight: 900; color: #fff; background: #c4222c; border-radius: 6px; padding: 4px 8px; min-height: 32px; box-sizing: border-box; }
  @keyframes rise { 0% { transform: translate(-50%, 6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-50%, -26px); opacity: 0; } }
  .delta { position: absolute; top: -40px; left: 50%; font-weight: 900; font-size: 30px; animation: rise 1.8s ease-out forwards; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.5); z-index: 3; }
  .ov { position: absolute; inset: 0; background: rgba(3,8,30,.7); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; min-width: min(400px, 100%); max-width: min(640px, calc(100% - 24px)); box-sizing: border-box; display: grid; gap: 14px; justify-items: center; text-align: center; }
  .notes { font-size: 14px; color: var(--muted); }

  /* title, setup, bank, results */
  .screen { position: absolute; inset: 0; padding: 14px 40px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: bold; }
  .field input { width: 120px; direction: ltr; text-align: center; font-size: 16px; font-weight: bold; }
  .box { padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  .box h3 { margin: 0; font-size: 16px; }

  .names input { width: 100%; box-sizing: border-box; direction: rtl; text-align: right; font-size: 14px; }
  .banklist { overflow: auto; flex: 1; min-height: 0; scrollbar-color: var(--line) var(--panel2); }
  .screen, .show { scrollbar-color: var(--line) transparent; }
  .bq { display: grid; grid-template-columns: 80px 100px 1fr 180px 64px; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; } }
  .toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 18px; font-size: 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .rstep { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 220px; flex-shrink: 0; opacity: 0; animation: stepIn .7s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  /* Results fit the 720 stage: the headline steps down with its length (results scene) and never shrinks into the podium;
     a podium name stays on one line, cut with "…" (full name in its title). */
  .rstep .rname { display: block; max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .winner { font-size: 64px; font-weight: 900; line-height: 1.2; color: var(--goldtxt); text-align: center; text-wrap: balance; max-width: 1180px; flex-shrink: 0; opacity: 0; animation: stepIn .8s cubic-bezier(.16,1,.3,1) forwards; }
  .rrest { opacity: 0; animation: stepIn .7s cubic-bezier(.16,1,.3,1) forwards; width: min(720px, 100%); padding: 6px 0; flex: none; }
  .tie { font-size: 14px; padding: 0 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
  .addq input, .addq select { direction: rtl; text-align: right; min-width: 0; }
  /* the host's answer key (phone) and its header chip */

// ---- Question bank import ------------------------------------------------------------------------
let bankMsg = null;
const WHY = { missing: 'خانة فارغة', duplicate: 'خيارات مكررة', long: 'نص أطول من ' + WaraqaCSV.MAX_CELL + ' حرف', limit: 'تجاوز ' + WaraqaCSV.MAX_ROWS + ' سؤال' };
const lineList = ls => ls.slice(0, 8).join('، ') + (ls.length > 8 ? ` و${ls.length - 8} غيرها` : '');
const whyList = sk => sk.slice(0, 5).map(x => `السطر ${x.line} (${WHY[x.why]})`).join('، ') + (sk.length > 5 ? ` و${sk.length - 5} غيرها` : '');
async function importCSV(file) { // the host's file: السؤال، الخيار 1 (الإجابة)، الخيار 2، الخيار 3، الخيار 4، المستوى
  const say = (text, good) => { bankMsg = { text, good }; go('bank'); };
  if (!/\.(csv|txt)$/i.test(file.name)) return say('اختر ملفاً بصيغة CSV', false);
  if (file.size > 2e6) return say('الملف أكبر من 2 ميغابايت', false);
  const buf = await file.arrayBuffer();
  let text; // Excel's "CSV UTF-8" is UTF-8; its plain "CSV" saves Arabic as Windows-1256
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { text = new TextDecoder('windows-1256').decode(buf); }
  const cat = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 30) || 'مستورد';
  const { questions, skipped, levelErrors } = WaraqaCSV.questionsFromCSV(text, cat);
  if (levelErrors.length) return say(`لم يُستورد الملف: عمود "المستوى" فارغ أو غير صحيح في السطر ${lineList(levelErrors)}. يجب أن يكون 1 أو 2 أو 3 في كل سطر.`, false);
  if (!questions.length) return say('لم أجد أسئلة صالحة في الملف' + (skipped.length ? ': ' + whyList(skipped) : '. تأكد من الأعمدة الستة.'), false);
  const apply = replace => {
    bank = replace ? questions : questions.concat(bank);
    const saved = saveBank();
    say(`${replace ? 'استُبدلت الأسئلة بـ' : 'أُضيف'} ${questions.length} سؤالاً من "${file.name}"` + (skipped.length ? ` · تُجوهل ${skipped.length}: ${whyList(skipped)}` : '')
      + (saved ? '' : ' · تنبيه: تعذر الحفظ في المتصفح، ستبقى الأسئلة حتى إغلاق الصفحة فقط'), saved);
  };
  const close = () => document.getElementById('importask')?.remove();
  const per = [1, 2, 3].map(l => `${LEVEL_NAMES[l]} ${questions.filter(q => q[6] === String(l)).length}`).join(' · ');
  close();
  ui.append(h('div', { class: 'ov', id: 'importask' }, h('div', { class: 'modal' },
    h('b', { style: 'font-size:20px' }, `في الملف ${questions.length} سؤالاً`), h('div', { class: 'muted' }, per),
    skipped.length ? h('div', { class: 'bad', style: 'font-size:13px' }, `سيُتجاهل ${skipped.length}: ${whyList(skipped)}`) : null,
    h('div', { class: 'muted' }, `في البنك الآن ${bank.length} سؤالاً. ماذا تريد أن تفعل بها؟`),
    h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center' },
      B('إضافتها إلى الأسئلة الحالية', 'good', () => { close(); apply(false); }, { 'data-primary': '1' }),
      B('استبدال الأسئلة الحالية', 'bad', () => { close(); apply(true); }), B('إلغاء', '', close)))));
}
let bankUndo = null; // the last deleted question, kept tune.undoSeconds for its "تراجع" toast
function deleteQuestion(i) {
  if (bank.length <= 1) return;
  if (bankUndo) clearTimeout(bankUndo.timer);
  bankUndo = { i, row: bank.splice(i, 1)[0], timer: setTimeout(() => { bankUndo = null; document.querySelector('.toast')?.remove(); }, tune.undoSeconds * 1000) };
  saveBank(); go('bank');
}
function confirmRestore() { // the same dialog as ending the show: replacing the bank loses the host's own questions
  if (document.getElementById('confirm')) return;
  const close = () => document.getElementById('confirm')?.remove();
  ui.append(h('div', { class: 'ov', id: 'confirm' }, h('div', { class: 'modal' }, h('b', { style: 'font-size:20px' }, 'استعادة الأسئلة الأصلية؟'),
    h('div', { class: 'muted' }, `تُحذف الأسئلة الحالية (${bank.length} سؤالاً) ويعود البنك إلى أسئلة اللعبة الـ${DEFAULT_BANK.length}. لا يمكن التراجع.`),
    h('div', { style: 'display:flex;gap:10px' }, B('نعم، استعِد الأصلية', 'bad', () => { bank = DEFAULT_BANK.map(r => r.slice()); saveBank(); go('bank'); }), B('إلغاء', '', close)))));
}

      h('div', {}, 'رمز المطابقة ', h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code))) : box;
    modal.append(...[h('div', { style: 'font-size:18px', id: 'keyrange' }, typed ? 'افتح هذا العنوان على جوالك واكتب رمز المفتاح:' : 'جارٍ تجهيز الرمز…'), shown,
      h('div', { class: 'keybtns' },
        B('تم المسح: أكمل المسابقة', 'gold', () => { for (const L of LEVELS) state.keyTo[L] = typed || keyBuilt?.small ? passTo(L, ask.from[L]) : ask.from[L] + keyBuilt.counts[L]; close(); }, { 'data-primary': '1', disabled: !typed, id: 'keydone' }),
        typed ? null : B('QR أصغر', '', () => { state.keyAsk.cap = Math.max(3, Math.floor((keyBuilt?.c || 20) / 2)); keyBuilt = null; renderAll(); }, { id: 'keysmaller', disabled: true }),
        codeOK() ? B(typed ? 'أظهر QR' : 'أظهر رمز المفتاح بدل QR', '', () => { state.keyAsk.view = typed ? null : 'code'; renderAll(); }, { id: 'keyview' }) : null,
        B('رجوع (Esc)', 'ghost', () => { state.keyAsk.step = 1; renderAll(); })),
      ownBank() ? h('div', { class: 'muted', style: 'font-size:14px' }, 'الرمز المكتوب يعمل مع أسئلة اللعبة الأصلية فقط؛ مع أسئلتك استعمل رمز QR.') : null].filter(Boolean));
  }
  const cap = ask.cap || 400;
  if (!(ask.step === 2 && ask.view === 'code' && codeOK())) (keyBuilt && keyBuilt.from === ask.from && keyBuilt.cap === cap ? Promise.resolve(keyBuilt) : buildKey(ask.from, cap)).then(k => {
    if (state.keyAsk !== ask || !modal.isConnected) return;
    if (!k) { box.replaceChildren(h('b', { style: 'color:#13204f' }, 'تعذّر صنع الرمز. ارفع keyMaxVersion في config.js.')); return; }
    keyBuilt = Object.assign(k, { cap });
    box.innerHTML = k.svg;
    if (ask.step === 1) { show.disabled = false; return; }
    document.getElementById('keyrange').replaceChildren((k.small ? 'امسح الرمز بجوالك: مفتاح كامل لأسئلة اللعبة' : 'امسح الرمز بجوالك: ' + LEVELS.filter(L => k.counts[L]).map(L => `${LEVEL_NAMES[L]} ${ask.from[L] + 1} إلى ${ask.from[L] + k.counts[L]}`).join('، ')) + ' · رمز المطابقة ', h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code));
    document.getElementById('keydone').disabled = false;
    const sm = document.getElementById('keysmaller'); if (sm) { sm.hidden = !!k.small; sm.disabled = k.c <= 5; }
  });
  ui.append(h('div', { class: 'ov', id: 'hostkey', 'data-step': String(ask.step), 'data-from': fromKey, 'data-cap': String(ask.cap || 0), 'data-view': ask.view || '', role: 'dialog', 'aria-label': 'مفتاح الإجابات للمقدّم' }, modal));
}

// ---- The host window (setup: شاشة المقدّم → نافذة على هذا الحاسوب; projector set to Extend) ----
// presenter.html stays on the laptop screen and shows the answer; this window, on the projector, is
// the only holder of the game. It sends a full snapshot on every render and every second; the host
// window sends back the same actions as the keyboard (Enter, 1–4) or the judge buttons, so each one
// works only where it already would. window.open + postMessage also work from file:// (a flash drive).
let presenter = null;
const presenterOpen = () => !!presenter && !presenter.closed;
function notice(text) { // a short notice with its own close button (the popup blocker's message)
  const el = h('div', { class: 'panel toast', role: 'status' }, text, B('حسناً', 'gold', () => el.remove())); ui.append(el);
}
function openPresenter() { // from a click only: browsers block pop-ups opened any other way
  closeHostMenu(); // the menu that held this button must not stay open on the projector
  if (presenterOpen()) { presenter.focus(); return; }
  presenter = window.open('presenter.html', 'waraqa-presenter', 'popup,width=960,height=720');
  if (!presenter) setTimeout(() => { if (scene === 'play') notice('منع المتصفح نافذة المقدّم. اسمح بالنوافذ المنبثقة لهذه الصفحة، ثم اضغط «افتح شاشة المقدّم» من ⋯ في الأعلى.'); }, 0);
  else if (scene === 'play') renderHeader();
}
let adoptAsk = null; // the window of a host window from before a reload that has said hello
function adoptPresenter() { // from a click or key only
  const w = adoptAsk; adoptAsk = null;
  if (w && !w.closed) { presenter = w; tellPresenter(); }
}
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (adoptAsk && !presenterOpen()) adoptPresenter(); }, true);
function tellPresenter() {
  if (!presenterOpen()) return;
  const playing = scene === 'play' && state, q = playing && state.q, p = playing ? state.phase : '';
  const asking = (p === 'question' || p === 'reveal') && q;
  const primary = p === 'level' ? null : ui.querySelector('[data-primary]:not([disabled])');
  const card = playing && p === 'cards' && state.card && state.cardStage !== 'pick' && !state.revealing ? state.card : null, acts = [];
  if (card && state.cardStage === 'choose') acts.push({ label: 'استخدمها الآن', cmd: 'use' }, { label: 'احتفظ بها', cmd: 'keep' });
  if (card && state.cardStage === 'target') others(state.cur).forEach(t => acts.push({ label: 'على ' + state.names[t], cmd: 'target', k: t }));
  const undoLeft = playing && undoSnap && (p === 'reveal' || p === 'cards') ? Math.max(0, Math.ceil(undoUntil - state.t)) : 0;
  if (p === 'cards' && undoLeft) acts.push({ label: `تراجع · ${undoLeft}`, cmd: 'undo' });
  presenter.postMessage({ type: 'state', scene, phase: p, paused: playing ? state.paused : false,
    round: playing ? state.round : 0, team: playing ? state.names[state.cur] : '', teamNo: playing ? state.cur + 1 : 0, teamColor: playing ? TEAM_COLORS[state.cur] : '', answering: asking ? state.names[state.cur] : '',
    levels: LEVELS.map(k => ({ k, name: LEVEL_NAMES[k], pts: levelPts(k), n: levelOK(k) ? 1 : 0 })),
    q: asking ? { n: q.n, own: !!q.own, level: LEVEL_NAMES[state.level], text: q.text, answer: q.choices[q.right], right: q.right + 1, choices: q.choices } : null,
    qmode: settings.qmode, done: p === 'reveal', result: p === 'reveal' ? state.result : null, undo: p === 'reveal' ? undoLeft : 0, timer: asking ? Math.ceil(state.timer) : null,
    ctx: card ? CARDS[card].name + ': ' + cardDesc(card) + (state.lines.length ? '\n' + state.lines.join(' · ') : '') : '', acts,
    primary: primary ? primary.textContent.trim() : '', judge: !!ui.querySelector('[data-judge="right"]:not([disabled])') }, '*');
}
setInterval(() => { // the snapshot's timer, and the header's "connected" label when the host window opens or closes
  tellPresenter();
  if (scene === 'play' && hostMode() === 'window') {
    const b = [...(refs.header?.querySelectorAll('button') || [])].find(x => x.textContent.includes('شاشة المقدّم'));
    if (b && b.textContent !== (presenterOpen() ? 'شاشة المقدّم: متصلة' : 'افتح شاشة المقدّم')) renderHeader();
  }
}, 1000);
addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'hello' && !presenterOpen()) { try { if (e.source && e.source !== window && e.source.name === 'waraqa-presenter') adoptAsk = e.source; } catch { if (location.protocol === 'file:') adoptAsk = e.source; } return; } // a host window from before a reload says hello: take it back on the next click
  if (!presenterOpen() || e.source !== presenter) return; // only the window this game opened
  if (m.type === 'hello') return tellPresenter();
  if (m.type !== 'cmd' || scene !== 'play') return;
  if (m.cmd === 'pause') { state.paused = !state.paused; renderHeader(); return; }
  if (state.paused || state.keyAsk || document.querySelector('.ov:not(#pause)')) return;
  if (m.cmd === 'enter') hit.add('Enter');
  else if ((m.cmd === 'choice' || m.cmd === 'level') && m.k >= 1 && m.k <= 4) hit.add('Digit' + m.k); // the same keys the game reads: a level in the level phase, a choice in a question
  else if (m.cmd === 'judge' && (m.v === 'right' || m.v === 'wrong')) ui.querySelector(`[data-judge="${m.v}"]:not([disabled])`)?.click();
  else if (m.cmd === 'undo') undo();
  else if (m.cmd === 'use' && state.phase === 'cards' && state.cardStage === 'choose' && !state.revealing) useNow();
  else if (m.cmd === 'keep' && state.phase === 'cards' && state.cardStage === 'choose' && !state.revealing) keepCard();
  else if (m.cmd === 'target' && state.phase === 'cards' && state.cardStage === 'target' && others(state.cur).includes(m.k)) hitTarget(m.k);
});

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
// ---- Intro: the logo for introTime seconds on load (config.js); any key or click skips it ----
function intro() {
  if (!tune.introTime || params.get('manual') === '1') return;
  const el = h('div', { id: 'intro', 'aria-hidden': 'true', style: `--t:${tune.introTime}s`, html:
    `<div class="i-spot"></div><div class="i-cd">${LOGO(1)}</div><div class="i-nm">${TITLE}</div>` });
  const end = () => { removeEventListener('keydown', skip, true); removeEventListener('pointerdown', skip, true); el.remove(); };
  const skip = e => { // capture phase: the key or click that skips never reaches the game
    if (!el.isConnected) return end(); // intro already gone: stop listening, let the key through
    e.preventDefault(); e.stopImmediatePropagation();
    if (!el.classList.contains('i-skip')) { el.classList.add('i-skip'); setTimeout(end, 200); }
  };
  addEventListener('keydown', skip, true); addEventListener('pointerdown', skip, true);
  setTimeout(end, tune.introTime * 1000);
  document.body.append(el);
}
intro();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
