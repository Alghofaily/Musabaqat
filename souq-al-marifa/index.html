<script>
'use strict';
// سوق المعرفة: a host-run team quiz on a live trading-platform screen. A right answer pays cash
// and opens a trading window; trades move prices, news moves sectors, the richest team wins.
// The UI is DOM over a canvas background; all game logic runs on the fixed step.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = "Tahoma, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif";
const TITLE = 'سوق المعرفة';
const CONTROLS = ['الفأرة أو اللمس: كل شيء', '1-4: اختيار الإجابة', 'Enter: الزر الرئيسي', 'P: إيقاف مؤقت · M: كتم الصوت', 'H مطولاً: رؤية الإجابة · Z: تراجع'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

      if (rs) { const total = state.phase === 'trade' ? settings.tradeTime : settings.answerTime; rs.innerHTML = ring(state.timer, total, ringSize()); document.getElementById('ringnum').textContent = Math.ceil(state.timer); }
      const cc = document.getElementById('clockchip');
      if (cc) { const left = Math.max(0, settings.minutes * 60 - state.elapsed); cc.textContent = `الوقت المتبقي ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`; }
      const ov = document.getElementById('pause');
      if (state.paused && !ov) ui.append(h('div', { id: 'pause', class: 'ov', onclick: () => { state.paused = false; renderHeader(); } }, h('div', { class: 'modal' }, h('b', { style: 'font-size:26px' }, 'إيقاف مؤقت'), h('span', { class: 'muted' }, 'اضغط للمتابعة (P)'))));
      if (!state.paused && ov) ov.remove();
    },
  },
  results: {
    enter() {
      ui.append(familyLink());
      if (!state.final) { reset(); endGameValues(); }
      const all = state.final.map(e => e.worth);
      const f = state.final.map(e => ({ ...e, rank: rankOf(e.worth, all) })).sort((a, b) => a.rank - b.rank || a.i - b.i);
      const tied = r => f.filter(e => e.rank === r).length > 1;
      const places = [...new Set(f.map(e => e.rank))].filter(r => r <= 3); // ascending: 1, then 2 or 3
      const heights = { 1: 140, 2: 105, 3: 78 }, medal = { 1: '#e0a100', 2: '#94a3b8', 3: '#b8733a' };
      const steps = {};
      for (const r of places) {
        const who = f.filter(e => e.rank === r);
        steps[r] = h('div', { class: 'pod', style: `display:flex;flex-direction:column;align-items:center;gap:6px;width:${Math.max(210, who.length * 150)}px` },
          h('div', { style: 'display:flex;gap:14px;align-items:flex-end' }, ...who.map(e => h('div', { style: 'display:flex;flex-direction:column;align-items:center;gap:4px;max-width:200px' },
            shield(e.i, r === 1 ? 50 : 40), h('b', { style: `font-size:${r === 1 ? 22 : 18}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%` }, state.names[e.i])))),
          h('span', { class: 'num', style: 'font-weight:bold;font-size:18px' }, fmt(who[0].worth)),
          h('div', { style: `width:100%;height:${heights[r]}px;border-radius:10px 10px 0 0;background:linear-gradient(${medal[r]}, ${medal[r]}aa);display:grid;place-items:center;font-size:54px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #0006` },
            h('span', { style: 'display:flex;align-items:center;gap:10px' }, N(r), who.length > 1 ? h('span', { style: 'font-size:20px' }, 'تعادل') : null)));
      }
      const top = f.filter(e => e.rank === 1).map(e => state.names[e.i]);
      const line = top.length > 1 ? 'تعادل: ' + top.slice(0, -1).join('، ') + ' و' + top[top.length - 1] : 'الفائز: ' + top[0];
      const headline = h('div', { class: 'winner', style: 'font-size:32px' }, 'النتائج النهائية');
      const table = h('div', { class: 'panel', style: 'width:820px;visibility:hidden' }, h('table', { class: 'lb' },
        h('tr', {}, ...['المركز', 'الفريق', 'الرصيد', 'قيمة الأسهم', 'صافي الثروة', 'الأداء'].map(s => h('th', {}, s))),
        ...f.map(e => { const g = (e.worth - state.startWorth) / state.startWorth;
          return h('tr', {}, h('td', {}, h('span', { style: 'display:flex;gap:8px;align-items:center' }, N(e.rank), tied(e.rank) ? h('span', { class: 'chip', style: 'font-size:14px;padding:2px 8px' }, 'تعادل') : null)),
            h('td', {}, h('span', { style: 'display:flex;gap:7px;align-items:center;font-weight:bold' }, shield(e.i, 18), state.names[e.i])),
            h('td', {}, N(fmt(e.cash))), h('td', {}, N(fmt(e.stock))), h('td', { style: 'font-weight:bold' }, N(fmt(e.worth))),
            h('td', {}, h('span', { class: 'pill ' + (g > 0 ? 'up' : g < 0 ? 'down' : 'flat') }, pct(g)))); })));
      ui.append(h('div', { class: 'screen', style: 'align-items:center;gap:10px;padding-top:14px' }, headline,
        h('div', { style: 'display:flex;align-items:flex-end;gap:16px;height:300px' }, ...[2, 1, 3].filter(r => steps[r]).map(r => steps[r])), // second, first, third, right to left
        table,
        h('div', { style: 'display:flex;gap:12px' }, B('مسابقة جديدة بنفس الإعدادات', 'pri', () => { reset(); go('play'); }, { 'data-primary': '1' }), B('الشاشة الرئيسية', '', () => go('title')))));
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      confetti = [];
      const finale = () => { // first place: the headline in display size, the full table, then the confetti
        headline.replaceChildren(h('span', { html: TROPHY, style: 'display:flex' }), h('span', {}, line));
        headline.style.fontSize = line.length > 40 ? '34px' : '52px'; headline.style.animation = 'pop .5s ease-out';
        table.style.visibility = 'visible'; sfx.win();
        if (!still) confetti = Array.from({ length: CHEAP ? 0 : 120 }, () => ({ x: vrng() * W, y: -vrng() * H, v: 60 + vrng() * 90, s: 5 + vrng() * 5, c: TEAM_COLORS[f[(vrng() * top.length) | 0].i], a: vrng() * 6, w: 1 + vrng() * 3 }));
      };
      // the podium fills from the lowest place up; tune.revealStep seconds apart, all at once for reduced motion
      res = { t: 0, n: 0, queue: places.slice().reverse().map(r => () => { steps[r].classList.add('in'); if (r === 1) finale(); else sfx.cash(); }) };
      if (still) { res.queue.forEach(fn => fn()); res.queue = []; }
    },
    update(dt) {
      res.t += dt;
      while (res.queue.length && res.t >= tune.revealStep * (res.n + 1)) { res.n++; res.queue.shift()(); }
      for (const p of confetti) { p.y += p.v * dt; p.a += p.w * dt; if (p.y > H + 10) p.y = -10; }
    },
    draw() {
      backdrop(false);
      for (const p of confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    },
  },
  figures: { // every drawn figure side by side, each named
    enter() {
      const cell = (el, name) => h('div', { class: 'panel', style: 'display:grid;place-items:center;gap:8px;padding:14px;min-height:120px' }, el, h('b', {}, name));
      ui.append(h('div', { class: 'screen', style: 'display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-content:start' },
        cell(h('span', { html: LOGO(1.6) }), 'الشعار'), cell(h('span', { html: TROPHY }), 'الكأس'),
        cell(h('span', { html: ring(18, 30) }), 'عداد الوقت'), cell(h('span', { html: spark([100, 104, 99, 108, 112, 109, 118]) }), 'رسم الأداء'),
        cell(h('span', { style: 'display:flex;gap:6px' }, ...[0, 1, 2, 3, 4, 5].map(i => shield(i, 26))), 'شعارات الفرق'),
        ...SECTORS.map(s => cell(secIcon(s), 'قطاع ' + s))));
    },
    update() {}, draw() { backdrop(false); },
  },
};
function endGameValues() { state.final = [...Array(state.n).keys()].map(i => ({ i, cash: state.cash[i], stock: 0, worth: worth(i) })); }
let confetti = [], res = { t: 0, n: 0, queue: [] };

// ---- Background: the platform's faint grid, and on the title a slow candle chart --------------
let candleData = null;
function backdrop(chart) {
  const cs = getComputedStyle(document.body);
  ctx.fillStyle = cs.getPropertyValue('--bg').trim() || '#0b1220'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = cs.getPropertyValue('--grid').trim() || 'rgba(120,150,200,.06)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
  if (!chart) return;
  if (!candleData) { let p = 0; candleData = Array.from({ length: 52 }, () => { const o = p; p += (vrng() - 0.42) * 22; return { o, c: p, hi: Math.max(o, p) + vrng() * 12, lo: Math.min(o, p) - vrng() * 12 }; }); }
  const up = cs.getPropertyValue('--up').trim(), dn = cs.getPropertyValue('--down').trim(), off = (state.t * 14) % 26, base = H * 0.8;
  ctx.globalAlpha = 0.14;
  candleData.forEach((k, i) => {
    const x = i * 26 - off, y = base - k.o, y2 = base - k.c;
    ctx.strokeStyle = ctx.fillStyle = k.c >= k.o ? up : dn;
    ctx.beginPath(); ctx.moveTo(x + 6, base - k.hi); ctx.lineTo(x + 6, base - k.lo); ctx.stroke();
    ctx.fillRect(x, Math.min(y, y2), 12, Math.max(2, Math.abs(y2 - y)));
  });
  ctx.globalAlpha = 1;
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && !typing()) setMuted(!muted);
  if ((pressed('KeyP') || pressed('Space')) && !typing() && scene === 'play') { state.paused = !state.paused; renderHeader(); }
  if ((pressed('Enter') || pressed('NumpadEnter')) && !typing() && !document.getElementById('confirm')) { // Enter: the screen's main button
    const p = (document.getElementById('importask') || document.getElementById('help') || ui).querySelector('[data-primary]:not([disabled])'); // an open dialog's own button first
    if (p) p.click();
  }
  if (pressed('Escape')) { document.getElementById('confirm')?.remove(); document.getElementById('importask')?.remove(); document.getElementById('help')?.remove(); }
  state.t += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

if (matchMedia('(max-width: 699px) and (orientation: portrait)').matches) // a phone held upright: the 1280x720 screen is tiny there
  document.body.append(h('div', { id: 'phone', role: 'note' }, h('span', {}, 'صُممت هذه اللعبة للابتوب وشاشة العرض'),
    h('button', { onclick: () => document.getElementById('phone').remove() }, 'حسناً')));
reset();
go(params.get('scene') || 'title');
last = clock.now();
// ---- Intro: the logo for introTime seconds on load (config.js); any key or click skips it ----
function intro() {
  if (!tune.introTime || params.get('manual') === '1') return;
  const el = h('div', { id: 'intro', 'aria-hidden': 'true', style: `--t:${tune.introTime}s`, html:
    `<svg class="i-mk" viewBox="19 35 222 174"><g fill="none" stroke="var(--up)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">` +
    `<path class="i-ln" pathLength="1" d="M40 128 L96 184 L208 72"/><path class="i-ln i-hd" pathLength="1" d="M132 60 H220 V148"/></g></svg>` +
    `<div class="i-nm">${TITLE}</div>` });
  const end = () => { removeEventListener('keydown', skip, true); removeEventListener('pointerdown', skip, true); el.remove(); };
  const skip = e => { // capture phase: the key or click that skips never reaches the game
    if (!el.isConnected) return end(); // intro already gone: stop listening, let the key through
    e.preventDefault(); e.stopImmediatePropagation();
    if (!el.classList.contains('i-skip')) { el.classList.add('i-skip'); setTimeout(end, 200); }
  };
  addEventListener('keydown', skip, true); addEventListener('pointerdown', skip, true);
  setTimeout(end, tune.introTime * 1000);
  document.body.append(el);
}
intro();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
