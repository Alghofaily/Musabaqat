  /* how-to-play scenes: one looping motion graphic per step, built from the game's own squares, mine, pennant and team rows. Each element's plain style

  @keyframes hs-e5 { 0%, 30% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 38%, 100% { opacity: 1; transform: none; } }

  /* intro: the mine drops and settles, its fuse runs out, the flame catches and flickers, then the name is written in, right to left.

  #intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; background: var(--bg); animation: intro-out var(--t) linear both; }

  #intro .i-fuse { animation: haql-fuse var(--t) both; }

  const primary = ui.querySelector('[data-primary]:not([disabled])');
  const ti = !playing ? -1 : asking ? (state.answeredBy ?? state.cur) : state.cur;

addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'hello' && !presenterOpen()) { try { if (e.source && e.source !== window && e.source.name === 'haql-presenter') adoptAsk = e.source; } catch { if (location.protocol === 'file:') adoptAsk = e.source; } return; }
  if (!presenterOpen() || e.source !== presenter) return;
