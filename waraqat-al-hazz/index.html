  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; }

<script>
'use strict';
// ورقة الحظ: a host-run team quiz show. A team picks how hard its question is, answers on the
// clock, and a right answer earns the level's points and one flip from twelve face-down cards
// (the card mix and effects of luckyquiz.exe). UI is DOM over a canvas stage; logic runs on the step.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = "Tahoma, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif";
const TITLE = 'ورقة الحظ';
const CONTROLS = ['الفأرة أو اللمس: كل شيء', '1-3: المستوى · 1-4: الإجابة', 'Enter: الزر الرئيسي', 'P: إيقاف مؤقت · M: كتم الصوت'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let vseed = 23; // decoration's own stream (sparkles, confetti, noise), never the game's chance
function vrng() { vseed = (vseed + 0x6D2B79F5) | 0; let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ui = document.getElementById('ui');
const ctx = canvas.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); ctx.setTransform(r, 0, 0, r, 0, 0);
  stage.style.transform = `translate(${Math.round((innerWidth - W * s) / 2)}px, ${Math.round((innerHeight - H * s) / 2)}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const typing = () => document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' && !typing()) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume; out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; if (scene === 'play') renderHeader(); }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.3, freq = 1200, delay = 0) { // filtered noise: flips, thunder, fire, the bomb
  if (!audio || muted) return;
  const ac = audio.ac, t = ac.currentTime + delay, buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (vrng() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(audio.out); src.start(t);
}
const sfx = {
  click: () => tone(880, 0.05, 'triangle', 0.12),
  right: () => [660, 880, 1320].forEach((f, i) => tone(f, 0.16, 'triangle', 0.22, i * 0.08)),
  wrong: () => { tone(200, 0.3, 'sawtooth', 0.16); tone(150, 0.4, 'sawtooth', 0.14, 0.1); },
  tick: () => tone(1200, 0.035, 'square', 0.1),
  deal: () => { for (let i = 0; i < 6; i++) noise(0.06, 0.12, 3000, i * 0.06); },
  flip: () => noise(0.18, 0.25, 2500),
  gain: () => [1500, 1900, 2300, 2700].forEach((f, i) => tone(f, 0.09, 'square', 0.08, 0.15 + i * 0.05)),
  loss: () => tone(500, 0.5, 'triangle', 0.22, 0.1, 160),
  thunder: () => { noise(0.9, 0.5, 400, 0.05); tone(80, 0.8, 'sine', 0.3, 0.05, 40); },
  fire: () => noise(1.1, 0.35, 900),
  boom: () => { noise(1.4, 0.6, 250); tone(120, 1.2, 'sine', 0.4, 0, 30); },
  dove: () => [1320, 1760, 2093].forEach((f, i) => tone(f, 0.25, 'sine', 0.15, i * 0.1)),
  stop: () => { tone(330, 0.18, 'square', 0.15); tone(330, 0.18, 'square', 0.15, 0.25); },
  again: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'triangle', 0.18, i * 0.07)),
  bad: () => tone(240, 0.12, 'square', 0.12),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.22, i * 0.12)),
};

// ---- Helpers ---------------------------------------------------------------------------
const fmt = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('en-US');
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toNum = s => parseInt(String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d-]/g, ''), 10);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const B = (label, cls, fn, extra = {}) => h('button', { class: 'btn ' + cls, onclick: () => { sfx.click(); fn(); }, ...extra }, label);
const N = v => h('span', { class: 'num' }, v);

// ---- Drawn figures -------------------------------------------------------------------------
const TEAM_COLORS = ['#3fa9ff', '#ff9f1c', '#b26bff', '#19c2a0', '#ff5fa2', '#9bd12f'];
function shield(i, size = 22) { // a team's badge: a shield in its colour with its number
  return h('span', { style: `display:inline-block;width:${size}px;height:${Math.round(size * 1.15)}px;flex:none`, html:
    `<svg viewBox="0 0 20 23" width="${size}" height="${Math.round(size * 1.15)}"><path d="M10 0 L20 3.5 V11 C20 17 15 21 10 23 C5 21 0 17 0 11 V3.5 Z" fill="${TEAM_COLORS[i]}"/>
     <path d="M10 2 L18 4.8 V11 C18 15.6 14.4 19 10 20.8 Z" fill="rgba(255,255,255,.2)"/>
     <text x="10" y="15.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" font-family="Arial">${i + 1}</text></svg>` });
}
function STAR(s, fill) { // a five-pointed star centred at 50,50
  const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.42 : s, a = -Math.PI / 2 + i * Math.PI / 5; pts.push(`${(50 + r * Math.cos(a)).toFixed(1)},${(50 + r * Math.sin(a)).toFixed(1)}`); }
  return `<polygon points="${pts.join(' ')}" fill="${fill}"/>`;
}
const BACK = `<svg viewBox="0 0 100 100" width="76" height="76"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-dasharray="7 6"/>
  ${STAR(32, 'rgba(255,255,255,.95)')}<text x="50" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#c98a00" font-family="Arial">?</text></svg>`;
const LOGO = (s = 1) => `<svg width="${64 * s}" height="${50 * s}" viewBox="0 0 64 50">
  <g transform="rotate(-16 22 40)"><rect x="8" y="6" width="26" height="36" rx="4" fill="#ffd25a" stroke="#c98a00" stroke-width="2"/></g>
  <g transform="rotate(14 42 40)"><rect x="30" y="6" width="26" height="36" rx="4" fill="#ffd25a" stroke="#c98a00" stroke-width="2"/></g>
  <rect x="19" y="2" width="26" height="38" rx="4" fill="#fffaf0" stroke="#f6c343" stroke-width="3"/>
  <g transform="translate(12 1) scale(.4)">${STAR(30, '#f6c343')}</g></svg>`;
function coins(n, color) { // a coin stack whose height follows the amount
  const k = Math.abs(n) >= 1000 ? 4 : Math.abs(n) >= 100 ? 3 : 2; let s = '';
  for (let i = 0; i < k; i++) s += `<ellipse cx="50" cy="${80 - i * 9}" rx="24" ry="8" fill="#d99a00"/><ellipse cx="50" cy="${76 - i * 9}" rx="24" ry="8" fill="#ffd25a" stroke="#c98a00" stroke-width="2"/>`;
  return `<svg viewBox="0 0 100 100" width="76" height="76">${s}<text x="50" y="${58 - k * 9}" text-anchor="middle" direction="ltr" unicode-bidi="embed" font-size="24" font-weight="bold" fill="${color}" font-family="Arial">${n > 0 ? '+' : '−'}${Math.abs(n)}</text></svg>`;
}
const ICONS = { // every card face its own drawing

            h('div', { style: `width:100%;height:${heights[r]}px;border-radius:12px 12px 0 0;background:linear-gradient(${medal[r]}, ${medal[r]}99);display:grid;place-items:center;font-size:56px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #0006` }, N(r + 1))); })),
        h('div', { class: 'panel', style: 'width:620px;padding:6px 0' }, ...f.map((e, r) => h('div', { style: 'display:flex;align-items:center;gap:12px;padding:6px 16px;font-weight:bold' },
          h('span', { class: 'muted', style: 'width:24px' }, N(r + 1)), shield(e.i, 18), h('span', { style: 'flex:1' }, state.names[e.i]), h('span', { class: 'num', style: 'color:var(--gold)' }, fmt(e.pts))))),
        h('div', { style: 'display:flex;gap:12px' }, B('مسابقة جديدة بنفس الإعدادات', 'gold', () => { reset(); go('play'); }, { 'data-primary': '1' }), B('الشاشة الرئيسية', '', () => go('title')))));
      confetti = Array.from({ length: CHEAP ? 0 : 130 }, () => ({ x: vrng() * W, y: -vrng() * H, v: 60 + vrng() * 90, s: 5 + vrng() * 6, c: vrng() < 0.6 ? '#f6c343' : TEAM_COLORS[(vrng() * state.n) | 0], a: vrng() * 6, w: 1 + vrng() * 3 }));
    },
    update(dt) { for (const p of confetti) { p.y += p.v * dt; p.a += p.w * dt; if (p.y > H + 10) p.y = -10; } },
    draw() { backdrop(); for (const p of confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); } },
  },
  figures: { // every card face and figure side by side, each named
    enter() {
      ui.append(h('div', { class: 'screen', style: 'display:grid;grid-template-columns:repeat(8,1fr);gap:10px;align-content:start;justify-items:center' },
        h('div', { style: 'display:grid;justify-items:center;gap:4px' }, cardEl(null, 'static'), h('b', { style: 'font-size:12px' }, 'ظهر الورقة')),
        ...Object.keys(CARDS).map(t => h('div', { style: 'display:grid;justify-items:center;gap:4px' }, cardEl(t, 'open static'), h('b', { style: 'font-size:12px' }, CARDS[t].name))),
        h('div', { style: 'display:grid;justify-items:center;gap:4px' }, h('span', { html: LOGO(1.4) }), h('b', { style: 'font-size:12px' }, 'الشعار')),
        h('div', { style: 'display:grid;justify-items:center;gap:4px' }, h('span', { html: TROPHY }), h('b', { style: 'font-size:12px' }, 'الكأس')),
        h('div', { style: 'display:grid;justify-items:center;gap:4px' }, h('span', { style: 'display:flex;gap:4px' }, ...[0, 1, 2, 3, 4, 5].map(i => shield(i, 18))), h('b', { style: 'font-size:12px' }, 'الفرق'))));
    },
    update() {}, draw() { backdrop(); },
  },
};
let confetti = [];

// ---- Background: the stage, sweeping spotlights, a glowing floor, sparkles ---------------------
const sparks = Array.from({ length: 40 }, () => ({ x: vrng() * W, y: vrng() * H * 0.6, p: vrng() * 6, s: 1 + vrng() * 2 }));
function backdrop() {
  const cs = getComputedStyle(document.body), bg = cs.getPropertyValue('--bg').trim() || '#071030', bg2 = cs.getPropertyValue('--bg2').trim() || '#13256f';
  const beam = cs.getPropertyValue('--beam').trim() || '255,236,170';
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, bg); g.addColorStop(1, bg2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fl = ctx.createRadialGradient(W / 2, H + 60, 40, W / 2, H + 60, 560); fl.addColorStop(0, `rgba(${beam},.32)`); fl.addColorStop(1, `rgba(${beam},0)`);
  ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
  const t = state.t * tune.beamSpeed;
  for (const [x, base, ph] of [[120, 0.95, 0], [W - 120, Math.PI - 0.95, 2.1], [W / 2, Math.PI / 2, 4.2]]) { // spotlight wedges sweeping across the stage
    const a = base + Math.sin(t + ph) * 0.35, len = 900, wdt = 0.13;
    const bg3 = ctx.createLinearGradient(x, -20, x + Math.cos(a) * len, -20 + Math.sin(a) * len);
    bg3.addColorStop(0, `rgba(${beam},.22)`); bg3.addColorStop(1, `rgba(${beam},0)`);
    ctx.fillStyle = bg3; ctx.beginPath(); ctx.moveTo(x, -20);
    ctx.lineTo(x + Math.cos(a - wdt) * len, -20 + Math.sin(a - wdt) * len); ctx.lineTo(x + Math.cos(a + wdt) * len, -20 + Math.sin(a + wdt) * len); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = `rgba(${beam},1)`;
  for (const s of sparks) { ctx.globalAlpha = 0.25 + 0.25 * Math.sin(state.t * 2 + s.p); ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && !typing()) setMuted(!muted);
  if ((pressed('KeyP') || pressed('Space')) && !typing() && scene === 'play') { state.paused = !state.paused; renderHeader(); }
  if ((pressed('Enter') || pressed('NumpadEnter')) && !typing() && !document.getElementById('confirm')) { // Enter: an open dialog's main button first, else the screen's
    const p = (document.querySelector('.ov:not(#pause)') || ui).querySelector('[data-primary]:not([disabled])');
    if (p) p.click();
  }
  if (pressed('Escape')) ['confirm', 'importask', 'usecard'].forEach(id => document.getElementById(id)?.remove());
  state.t += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
