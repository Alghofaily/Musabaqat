<script>
'use strict';
// حصون المعرفة: a host-run team quiz on a hex war map. Each turn a team answers for money, trades at
// the market, attacks a neighbour and moves. A battle is fought question by question, the teams
// answering in turn, with M3arik's hits (3 per cannon + 3, halved by a fort). A fallen capital
// knocks its team out. The map is drawn on the canvas; the panels are DOM over it.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = "Plex, Tahoma, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif";

const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let vseed = 11; // decoration's own stream (confetti), never the game's chance
function vrng() { vseed = (vseed + 0x6D2B79F5) | 0; let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const events = [];
const R = HusunRules;

// ---- Screen ---------------------------------------------------------------------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ui = document.getElementById('ui');
const ctx = canvas.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); ctx.setTransform(r, 0, 0, r, 0, 0);
  stage.style.transform = `translate(${Math.round((innerWidth - W * s) / 2)}px, ${Math.round((innerHeight - H * s) / 2)}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const typing = () => document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' && !typing()) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume; out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; if (scene === 'play') renderHeader(); }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  click: () => tone(880, 0.05, 'triangle', 0.12),
  right: () => [660, 880, 1320].forEach((f, i) => tone(f, 0.16, 'triangle', 0.22, i * 0.08)),
  wrong: () => { tone(200, 0.3, 'sawtooth', 0.16); tone(150, 0.4, 'sawtooth', 0.14, 0.1); },
  coin: () => [1500, 2000].forEach((f, i) => tone(f, 0.07, 'square', 0.08, i * 0.05)),
  tick: () => tone(1200, 0.035, 'square', 0.1),
  drums: () => [0, 0.14, 0.28, 0.5].forEach((d, i) => tone(i === 3 ? 70 : 95, 0.18, 'triangle', 0.45, d)),
  capture: () => [392, 523, 659, 784].forEach((f, i) => tone(f, i === 3 ? 0.4 : 0.14, 'square', 0.12, i * 0.11)),
  fall: () => { [784, 659, 523, 392, 262].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.12, i * 0.13)); tone(55, 0.9, 'triangle', 0.5, 0.65); },
  hold: () => { tone(330, 0.12, 'triangle', 0.2); tone(330, 0.25, 'triangle', 0.2, 0.16); },
  bad: () => tone(240, 0.12, 'square', 0.12),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.22, i * 0.12)),
};

// ---- Helpers ---------------------------------------------------------------------------
const fmt = n => Math.round(n).toLocaleString('en-US');

const toNum = s => parseInt(String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d-]/g, ''), 10);
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));

}

const N = v => h('span', { class: 'num' }, v);

// ---- Drawn figures: one set of paths for the canvas (Path2D) and the panels (SVG) -----------

  { c: '#e5484d', emblem: 'M10 2 L12.4 7.6 L18.5 8.2 L13.9 12.1 L15.3 18 L10 14.9 L4.7 18 L6.1 12.1 L1.5 8.2 L7.6 7.6 Z' },        // star
  { c: '#3e83f8', emblem: 'M13 3 A7.5 7.5 0 1 0 13 17 A8 8 0 0 1 13 3 Z' },                                                  // crescent
  { c: '#2fa36b', emblem: 'M10 1.5 L17.5 10 L10 18.5 L2.5 10 Z' },                                                                  // diamond
  { c: '#e09b1f', emblem: 'M10 2.5 L18 17 H2 Z' },                                                                                  // triangle
  { c: '#9257d1', emblem: 'M7.8 2 H12.2 V7.8 H18 V12.2 H12.2 V18 H7.8 V12.2 H2 V7.8 H7.8 Z' },                                     // cross
  { c: '#12a39a', emblem: 'M2 4 L10 10 L18 4 V9 L10 15.5 L2 9 Z M2 11 L10 17 L18 11 V14 L10 20 L2 14 Z' },                         // chevrons
];
const FORT = 'M2 38 V16 H4 V12.5 H6.5 V16 H8.5 V12.5 H11 V16 H13 V22 H15 V10 H16.8 V6.5 H19 V10 H21 V6.5 H23.2 V10 H25 V22 H27 V16 H29 V12.5 H31.5 V16 H33.5 V12.5 H36 V16 H38 V38 Z';
const FORT_GATE = 'M16.5 38 V31.5 A3.5 3.5 0 0 1 23.5 31.5 V38 Z';
const FORT_WIN = 'M6.5 21 h2 v4.5 h-2 z M31.5 21 h2 v4.5 h-2 z M19 14 h2 v4.5 h-2 z';
const BANNER_POLE = 'M8 3 h2.6 v35 h-2.6 z';
const BANNER_TOP = 'M9.3 0 L12 3 H6.6 Z';
const BANNER_CLOTH = 'M10.6 4.5 H35 L29.5 12.5 L35 20.5 H10.6 Z';
const SHIELD = 'M10 0 L20 3.5 V11 C20 17 15 21 10 23 C5 21 0 17 0 11 V3.5 Z';

function trade(kind, n) { // n > 0 buys n, n < 0 sells -n, on the chosen hex

  if (hx < 0 || state.g.owner[hx] !== t) return;

  if (n > 0 && kind === 'fort' && have) return no('في هذه الأرض حصن');

  if (n < 0 && have < -n) return no('لا يوجد ما تبيعه هنا');

  ctx.fillStyle = css('--bg') || '#0e1624'; ctx.fillRect(0, 0, W, H);
  if (!title) return;
  const r = 46, s3 = Math.sqrt(3), off = (state.t * 6) % (s3 * r);
  ctx.strokeStyle = css('--wave'); ctx.lineWidth = 1.5;
  for (let row = -1; row < 12; row++) for (let col = -1; col < 18; col++) ctx.stroke(hexPath(col * s3 * r + (row & 1) * s3 * r / 2 - off, row * 1.5 * r, r - 2));
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM') && !typing()) setMuted(!muted);
  if (pressed('KeyP') && !typing() && scene === 'play') { state.paused = !state.paused; renderHeader(); }
  if ((pressed('Enter') || pressed('NumpadEnter')) && !typing() && !document.getElementById('confirm')) { // Enter: the screen's main button
    const p = (document.getElementById('importask') || document.getElementById('help') || ui).querySelector('[data-primary]:not([disabled])');
    if (p) p.click();
  }
  if (pressed('Escape')) { document.getElementById('confirm')?.remove(); document.getElementById('importask')?.remove(); if (document.getElementById('help')) { document.getElementById('help').remove(); if (scene === 'play') state.paused = false; } }
  state.t += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
