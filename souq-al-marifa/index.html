  table.lb { width: 100%; border-collapse: collapse; font-size: 18px; }
  table.lb th { color: var(--muted); font-weight: normal; font-size: 14px; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.lb td { padding: 0 10px; height: 33px; border-bottom: 1px solid var(--line); }
  table.lb tr.cur { background: color-mix(in srgb, var(--team) 20%, transparent); }

  /* how-to-play scenes: one looping motion graphic per step, drawn from the game's own parts. Each element's plain style is its end
     state, so reduced motion (animations off) shows the finished picture; the keyframes only lead into it. */
  .hs { position: relative; width: 704px; height: 396px; max-width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; direction: rtl; text-align: right;
    background: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; --d: 6s; }
  .hs > .in { position: absolute; inset: 0; animation: hs-cycle var(--d) linear infinite both; }
  .hs .ab { position: absolute; }
  .hs .e1 { animation: hs-e1 var(--d) infinite both; } .hs .e2 { animation: hs-e2 var(--d) infinite both; } .hs .e3 { animation: hs-e3 var(--d) infinite both; }
  .hs .e4 { animation: hs-e4 var(--d) infinite both; } .hs .e5 { animation: hs-e5 var(--d) infinite both; } .hs .e6 { animation: hs-e6 var(--d) infinite both; }
  .hs .e7 { animation: hs-e7 var(--d) infinite both; } .hs .e8 { animation: hs-e8 var(--d) infinite both; }
  @keyframes hs-cycle { 0% { opacity: 0; } 3%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes hs-e1 { 0%, 4% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 12%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e2 { 0%, 10% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 18%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e3 { 0%, 16% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 24%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e4 { 0%, 22% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 30%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e5 { 0%, 30% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 38%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e6 { 0%, 38% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 46%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e7 { 0%, 50% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 58%, 100% { opacity: 1; transform: none; } }
  @keyframes hs-e8 { 0%, 70% { opacity: 0; transform: translateY(14px) scale(.96); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 78%, 100% { opacity: 1; transform: none; } }
  .hs .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .hs .lab { color: var(--muted); font-size: 14px; }
  .hs .val { font-size: 26px; font-weight: 700; }
  .hs .tm { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; padding: 8px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--team); }
  .hs .opt { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 40px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); font-size: 17px; font-weight: 700; }
  .hs .opt i { font-style: normal; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .hs .sw { display: inline-grid; } .hs .sw > * { grid-area: 1 / 1; }
  /* 1 setup: the teams join, the money and the clock are set, then the host starts */
  .hs .go { animation: hs-press var(--d) infinite both; }
  @keyframes hs-press { 0%, 80% { transform: none; box-shadow: 0 0 0 0 transparent; } 83% { transform: scale(.93); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent); } 88%, 100% { transform: none; box-shadow: 0 0 0 0 transparent; } }
  /* 2 the question: the turn's team, the question, its four answers, and the clock running down */
  .hs .clock circle.run { stroke-dasharray: 176; stroke-dashoffset: 132; animation: hs-clock var(--d) infinite both; }
  @keyframes hs-clock { 0%, 30% { stroke-dashoffset: 0; stroke: var(--accent); } 74% { stroke: var(--accent); } 76%, 100% { stroke-dashoffset: 132; stroke: var(--down); } }
  /* 3 a right answer pays: the answer turns green, the reward flies into the team's balance, the market opens */
  .hs .okopt { animation: hs-ok var(--d) infinite both; background: var(--upbg); border-color: var(--up); }
  @keyframes hs-ok { 0%, 26% { background: var(--panel2); border-color: var(--line); } 30%, 100% { background: var(--upbg); border-color: var(--up); } }
  .hs .tick path { stroke-dasharray: 30; animation: hs-tick var(--d) infinite both; }
  @keyframes hs-tick { 0%, 28% { stroke-dashoffset: 30; } 36%, 100% { stroke-dashoffset: 0; } }
  .hs .gain { animation: hs-fly var(--d) infinite both; opacity: 0; }
  @keyframes hs-fly { 0%, 34% { opacity: 0; transform: translate(0, 10px) scale(.7); } 40% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.6, 0, .3, 1); } 48% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.6, 0, .3, 1); }
    60% { opacity: .9; transform: translate(-150px, 166px) scale(.45); } 63%, 100% { opacity: 0; transform: translate(-150px, 166px) scale(.4); } }
  .hs .old3 { animation: hs-out60 var(--d) infinite both; opacity: 0; } .hs .new3 { animation: hs-in60 var(--d) infinite both; }
  @keyframes hs-out60 { 0%, 59% { opacity: 1; transform: none; } 64%, 100% { opacity: 0; transform: translateY(-10px); } }
  @keyframes hs-in60 { 0%, 60% { opacity: 0; transform: translateY(10px); } 66%, 100% { opacity: 1; transform: none; } }
  .hs .flash3 { animation: hs-flash60 var(--d) infinite both; }

  /* 4 trading: a buy lifts the price; then breaking news lifts the whole sector */
  .hs .row { display: grid; grid-template-columns: 30px 1fr 70px 120px 96px; align-items: center; gap: 12px; height: 52px; padding: 0 14px; }
  .hs .rw + .rw { border-top: 1px solid var(--line); }

  @keyframes hs-newsrow { 0%, 58% { outline-color: transparent; background: transparent; } 62%, 100% { outline-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); } }
  .hs .newsb { display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 18px; font-weight: 700; background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: hs-news var(--d) infinite both; }
  .hs .newsb .tag { background: var(--gold); color: #0b1220; padding: 2px 10px; border-radius: 4px; }

  /* 5 the winner: each team's worth stacks up as its balance plus its shares at market price; the tallest wins */
  .hs .bars { display: flex; align-items: flex-end; justify-content: center; gap: 56px; }
  .hs .col { display: grid; justify-items: center; gap: 8px; width: 132px; }

  .hs .shares { background: var(--team); transform-origin: 50% 100%; animation: hs-grow2 var(--d) infinite both; }

// ---- Background: the platform's faint grid, and on the title a slow candle chart --------------
let candleData = null;
function backdrop(chart) {
  const cs = getComputedStyle(document.body);
  ctx.fillStyle = cs.getPropertyValue('--bg').trim() || '#0b1220'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = cs.getPropertyValue('--grid').trim() || 'rgba(120,150,200,.06)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
  if (!chart) return;
  if (!candleData) { let p = 0; candleData = Array.from({ length: 52 }, () => { const o = p; p += (vrng() - 0.42) * 22; return { o, c: p, hi: Math.max(o, p) + vrng() * 12, lo: Math.min(o, p) - vrng() * 12 }; }); }
  const up = cs.getPropertyValue('--up').trim(), dn = cs.getPropertyValue('--down').trim(), off = (state.t * 14) % 26, base = H * 0.8;
  ctx.globalAlpha = 0.14;
  candleData.forEach((k, i) => {
    const x = i * 26 - off, y = base - k.o, y2 = base - k.c;
    ctx.strokeStyle = ctx.fillStyle = k.c >= k.o ? up : dn;
    ctx.beginPath(); ctx.moveTo(x + 6, base - k.hi); ctx.lineTo(x + 6, base - k.lo); ctx.stroke();
    ctx.fillRect(x, Math.min(y, y2), 12, Math.max(2, Math.abs(y2 - y)));
  });
  ctx.globalAlpha = 1;
}

function step() {

  if ((pressed('KeyP') || pressed('Space')) && !typing() && scene === 'play') { state.paused = !state.paused; renderHeader(); }
  if ((pressed('Enter') || pressed('NumpadEnter')) && !typing() && !document.getElementById('confirm')) { // Enter: the screen's main button
    const p = (document.getElementById('hostkey') || document.getElementById('importask') || document.getElementById('help') || ui).querySelector('[data-primary]:not([disabled])'); // an open dialog's own button first
    if (p) p.click();
  }
  if (pressed('Escape') && hostMenuOpen) closeHostMenu();
  if (pressed('Escape') && state && state.keyAsk && state.keyAsk.step === 2 && document.getElementById('hostkey')) { state.keyAsk.step = 1; renderAll(); }
  else if (pressed('Escape')) { document.getElementById('confirm')?.remove(); document.getElementById('importask')?.remove(); document.getElementById('help')?.remove(); }

// ---- The host's answer key on a phone (setup: شاشة المقدّم → على جوالي; projector duplicates the laptop) ----
// The key screen comes at Start, at the start of a turn when fewer than keyReserve questions are left
// on the key (so no battle is cut), and, as a last resort, before a question past the key. Step 1 asks
// the host to hide the projector; step 2 shows one QR code of key.html with the next questions and
// answers in its #hash (pack.js), as many as fit the biggest code allowed; "done scanning" resumes.
// Running from a flash drive (file://), the code points at the published key.html; ?keybase= overrides.
const KEY_PAGE = params.get('keybase') || (location.protocol.startsWith('http') ? new URL('key.html', location.href).href
  : 'https://alghofaily.github.io/Musabaqat/souq-al-marifa/key.html');
let keyBuilt = null; // { from, count, svg } for the key screen now up
function keyRows(from, count) { // the questions the game will ask from position `from`, in its order (rules.js questionOrder)
  return O.questionOrder(bank.length, state.seed0, from, count).map((bi, i) =>
    [from + i + 1, SouqKey.cut(bank[bi][1], tune.keyQuestionChars), SouqKey.cut(bank[bi][2], tune.keyAnswerChars)]);
}
async function buildKey(from, cap = 400) {

    const url = KEY_PAGE + '#c=' + typedCode().replace('-', '');
    for (let t = 1; t <= 40; t++) { try { const q = qrcode(t, 'L'); q.addData(url, 'Byte'); q.make(); return { from, count: passEnd(from) - from, small: true, svg: q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }) }; } catch (e) { /* too long for t */ } }
  } // the most questions (up to cap) that fit one code of keyMaxVersion, then the smallest code that holds them

    try { const q = qrcode(tune.keyMaxVersion, 'L'); q.addData(url, 'Byte'); q.make(); return url; } catch (e) { return null; } };
  let lo = 0, hi = Math.min(cap, bank.length), url = null; // one pass of the bank at most: past it the same questions come again
  while (lo < hi) { const m = (lo + hi + 1) >> 1; const u = await fits(m); if (u) { lo = m; url = u; } else hi = m - 1; }
  if (!url) return null;
  for (let t = 1; t <= tune.keyMaxVersion; t++) { try { const q = qrcode(t, 'L'); q.addData(url, 'Byte'); q.make(); return { from, count: lo, svg: q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }) }; } catch (e) { /* too long for t */ } }

function phoneKey() { return hostMode() === 'phone' && state; }
// The typed code (key.html with no QR) and the small QR work only with the built-in bank and a whole 32-bit seed, because
// the phone rebuilds the key from DEFAULT_BANK and the seed (.claude/plans/key-typed-code.plan.md). They cover a whole pass.
const ownBank = () => O.matchCode(bank, 0) !== O.matchCode(DEFAULT_BANK, 0);
const codeOK = () => Number.isInteger(state.seed0) && state.seed0 === (state.seed0 | 0) && !ownBank();
const typedCode = () => { const c = O.keyCode('S', DEFAULT_BANK, state.seed0); return c.slice(0, 3) + '-' + c.slice(3); };
// The typed code is masked on the projector and shows only while the host HOLDS this button (pointer, or Space/Enter on it),
// so a photo of the room never holds the key. The real code lives only in this closure, never in the page text until held.
function holdToShowCode() {
  const real = typedCode(), mask = real.replace(/[^-]/g, '•'), el = h('div', { class: 'bigcode', id: 'typedcode' }, mask);
  const on = v => { el.textContent = v ? real : mask; };
  const stop = e => e.stopPropagation(); // Space must not reach the game's pause key
  const btn = B('اضغط مطوّلاً لإظهار رمز المفتاح', '', () => {}, { id: 'holdcode', style: 'user-select:none;touch-action:none',
    onpointerdown: e => { e.currentTarget.setPointerCapture?.(e.pointerId); on(true); }, onpointerup: () => on(false), onpointercancel: () => on(false),
    onpointerleave: () => on(false), onlostpointercapture: () => on(false), onblur: () => on(false), oncontextmenu: e => e.preventDefault(),
    onkeydown: e => { stop(e); if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(true); } }, onkeyup: e => { stop(e); if (e.key === ' ' || e.key === 'Enter') on(false); } });

const keyAddress = () => KEY_PAGE.replace(/^https?:\/\//, '').replace(/#.*$/, ''); // the page's short address, as typed on a phone

  const early = state.phase === 'ready' && !state.keyAsk;
  const left = Math.max(0, state.keyTo - state.qi), near = state.keyTo > 0 && left <= tune.keyReserve + 10, can = early && state.keyTo > 0;
  return h('button', { class: 'chip keychip' + (near ? ' near' : ''), disabled: !can,
    title: can ? 'خذ مفتاح الأسئلة التالية الآن' : 'يطابق الرمز على جوال المقدّم',
    onclick: () => { state.keyAsk = { from: state.qi, step: 1 }; renderAll(); } },
    'رمز المطابقة ', h('b', { class: 'num' }, state.code), state.keyTo > 0 ? [' · بقي ', h('b', { class: 'num' }, left), ' في المفتاح'] : null,
    can ? h('span', { class: 'take' }, ' · خذ التالي') : null);
}
function renderHostKey() {
  const ask = state.keyAsk, old = document.getElementById('hostkey');
  if (!ask) { old?.remove(); keyBuilt = null; return; }
  if (old && old.dataset.step === String(ask.step) && old.dataset.from === String(ask.from) && old.dataset.cap === String(ask.cap || 0) && old.dataset.view === (ask.view || '')) return;
  old?.remove();
  const first = ask.from === 0, remain = state.keyTo - state.qi;
  const close = () => { state.keyAsk = null; renderAll(); };
  const box = h('div', { class: 'qrbox' + (ask.step === 1 ? ' veiled' : '') }, h('span', { class: 'muted' }, 'جارٍ تجهيز الرمز…'));

  const show = B('جهاز العرض مخفي: أظهر الرمز', 'pri', () => { state.keyAsk.step = 2; renderAll(); }, { disabled: true });
  const modal = h('div', { class: 'modal keymodal' });
  if (ask.step === 1) {
    modal.append(h('b', { style: 'font-size:24px' }, first ? 'مفتاح الإجابات للمقدّم' : 'مفتاح الأسئلة التالية'),
      h('div', { class: 'keywarn' }, 'أخفِ شاشة العرض أولاً: زر الإخفاء في جهاز العرض، أو Win+P ثم «شاشة الكمبيوتر فقط». في الرمز إجابات الأسئلة القادمة، ومن يصوّره من الجمهور يراها.'),
      box,
      h('div', { class: 'keybtns' }, show,
        remain > 0 ? B(`لاحقاً (بقي ${remain} في المفتاح)`, '', () => { state.keySnooze = state.turns; close(); }) : null));
  } else {
    const typed = ask.view === 'code' && codeOK(); // the typed code instead of the QR: the whole pass, nothing to build
    const shown = typed ? h('div', { class: 'codeview' }, ...holdToShowCode(), h('div', { class: 'addr', id: 'keyaddr' }, keyAddress()),
      h('div', {}, 'رمز المطابقة ', h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code))) : box;
    modal.append(...[h('div', { style: 'font-size:18px', id: 'keyrange' }, typed ? 'افتح هذا العنوان على جوالك واكتب رمز المفتاح:' : 'جارٍ تجهيز الرمز…'), shown,
      h('div', { class: 'keybtns' },
        B('تم المسح: أكمل المسابقة', 'pri', () => { state.keyTo = typed || keyBuilt?.small ? passEnd(ask.from) : ask.from + keyBuilt.count; close(); }, { 'data-primary': '1', disabled: !typed, id: 'keydone' }),
        typed ? null : B('QR أصغر', '', () => { state.keyAsk.cap = Math.max(5, Math.floor((keyBuilt?.count || 20) / 2)); keyBuilt = null; renderAll(); }, { id: 'keysmaller', disabled: true }),
        codeOK() ? B(typed ? 'أظهر QR' : 'أظهر رمز المفتاح بدل QR', '', () => { state.keyAsk.view = typed ? null : 'code'; renderAll(); }, { id: 'keyview' }) : null,
        B('رجوع (Esc)', 'ghost', () => { state.keyAsk.step = 1; renderAll(); })),
      ownBank() ? h('div', { class: 'muted', style: 'font-size:14px' }, 'الرمز المكتوب يعمل مع أسئلة اللعبة الأصلية فقط؛ مع أسئلتك استعمل رمز QR.') : null].filter(Boolean));
  }
  const cap = ask.cap || 400;
  if (!(ask.step === 2 && ask.view === 'code' && codeOK())) (keyBuilt && keyBuilt.from === ask.from && keyBuilt.cap === cap ? Promise.resolve(keyBuilt) : buildKey(ask.from, cap)).then(k => {
    if (state.keyAsk !== ask || !modal.isConnected) return;
    if (!k) { box.replaceChildren(h('b', { style: 'color:var(--bg)' }, 'تعذّر صنع الرمز. ارفع keyMaxVersion في config.js.')); return; }
    keyBuilt = Object.assign(k, { cap });
    box.innerHTML = k.svg;
    if (ask.step === 1) { show.disabled = false; return; }
    document.getElementById('keyrange').replaceChildren(k.small ? 'امسح الرمز بجوالك: مفتاح كامل لأسئلة اللعبة · رمز المطابقة ' : `امسح الرمز بجوالك: الأسئلة ${ask.from + 1} إلى ${ask.from + k.count} · رمز المطابقة `, h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code));
    document.getElementById('keydone').disabled = false;
    const sm = document.getElementById('keysmaller'); if (sm) { sm.hidden = !!k.small; sm.disabled = k.count <= 10; }

  ui.append(h('div', { class: 'ov', id: 'hostkey', 'data-step': String(ask.step), 'data-from': String(ask.from), 'data-cap': String(ask.cap || 0), 'data-view': ask.view || '', role: 'dialog', 'aria-label': 'مفتاح الإجابات للمقدّم' }, modal));
}

// ---- The host window (setup: شاشة المقدّم → نافذة على هذا الحاسوب; projector set to Extend) ----
// presenter.html stays on the laptop screen and shows the answer; this window, on the projector, is
// the only holder of the game. It sends a full snapshot on every render and every second; the host
// window sends back the same actions as the keyboard (Enter, 1–4) or the judge buttons, so each one
// works only where it already would. window.open + postMessage also work from file:// (a flash drive).
let presenter = null;

function openPresenter() { // from a click only: browsers block pop-ups opened any other way
  closeHostMenu(); // the menu that held this button must not stay open on the projector
  if (presenterOpen()) { presenter.focus(); return; }
  presenter = window.open('presenter.html', 'souq-presenter', 'popup,width=960,height=720');
  if (!presenter) setTimeout(() => { if (scene === 'play') { state.msg = 'منع المتصفح نافذة المقدّم. اسمح بالنوافذ المنبثقة لهذه الصفحة، ثم اضغط «افتح شاشة المقدّم» من ⋯ في الأعلى.'; state.msgGood = false; renderAll(); } }, 0);
  else if (scene === 'play') renderHeader();

let adoptAsk = null; // the window of a host window from before a reload that has said hello
function adoptPresenter() { // from a click or key only
  const w = adoptAsk; adoptAsk = null;
  if (w && !w.closed) { presenter = w; tellPresenter(); }
}
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (adoptAsk && !presenterOpen()) adoptPresenter(); }, true);
function tellPresenter() {
  if (!presenterOpen()) return;
  const playing = scene === 'play' && state, q = playing && state.q, p = playing ? state.phase : '';
  const asking = (p === 'question' || p === 'reveal') && q; // the host's own questions too: the presenter shows «سؤالك أنت»
  const primary = ui.querySelector('[data-primary]:not([disabled])');
  const ti = !playing ? -1 : asking ? (state.answeredBy ?? state.cur) : state.cur, n = playing && state.news;
  const ctx = p === 'news' && n ? [n.text, ...(n.kind === 'sector' ? n.moves.map(([co, a, b]) => `${COMPANIES[co].name}: ${pct((b - a) / a)}`) : n.kind === 'dividend' ? n.paid.map(([i, amt]) => `${state.names[i]}: +${fmt(amt)}`) : [])].join('\n') : '';

    answering: asking && state.answeredBy != null ? state.names[state.answeredBy] : '',

    qmode: settings.qmode, done: p === 'reveal', result: p === 'reveal' ? state.result : null, undo: undo && p === 'reveal' ? Math.max(0, Math.ceil(undo.until - state.t)) : 0,
    timer: asking ? Math.ceil(state.timer) : null, ctx, acts: [],
    primary: primary ? primary.textContent.trim() : '', judge: !!ui.querySelector('[data-judge="right"]:not([disabled])') }, '*');

setInterval(() => { // the snapshot's timer, and the header's "connected" label when the host window opens or closes
  tellPresenter();

    const b = [...(refs.header?.querySelectorAll('button') || [])].find(x => x.textContent.includes('شاشة المقدّم'));
    if (b && b.textContent !== (presenterOpen() ? 'شاشة المقدّم: متصلة' : 'افتح شاشة المقدّم')) renderHeader();

addEventListener('message', e => {
  const m = e.data || {};

  else if (m.cmd === 'judge' && (m.v === 'right' || m.v === 'wrong')) ui.querySelector(`[data-judge="${m.v}"]:not([disabled])`)?.click();

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },

// ---- Intro: the logo for introTime seconds on load (config.js); any key or click skips it ----
function intro() {
