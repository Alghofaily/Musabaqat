  /* title, setup, bank, results */
  .screen { position: absolute; inset: 0; padding: 8px 40px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; overflow-y: auto; }

  /* intro: the logo's lockup rises and fades; every timing is a share of --t (config introTime) */
  #intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; background: var(--bg); animation: intro-out var(--t) linear both; }

  @media (prefers-reduced-motion: reduce) { #intro, #intro * { animation: none !important; } }

  .light { --mq-name: #0b1220; --mq-g: #0b8a5a; --mq-y: #b97f06; --mq-b: #2c56a8; }
  /* play screen: the field is the hero (left column in the ready and open phases); in the question phase the question takes the stage and the field steps aside */
  #app { position: absolute; inset: 0; display: grid; grid-template-rows: var(--hh) 1fr; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .sp { flex: 1; }
  header .btn { min-height: 44px; padding: 8px 14px; font-size: 14px; }
  .chip.stat { font-size: 15px; padding: 5px 12px; gap: 7px; }
  .chip.stat b { font-size: 18px; }

  main > #bd { grid-column: 1; grid-row: 1 / span 2; display: flex; flex-direction: column; min-height: 0; position: relative; transition: opacity .25s ease-out, filter .25s ease-out; }

<script>
'use strict';
// حقل الألغام: a host-run team quiz on a minefield. A right answer lets the team open one closed square: a safe one pays and
// shows how many mines touch it, a mine costs points and blows open the squares around it. The field's rules live in rules.js
// (HaqlRules); this file is the host's screens around them. The UI is DOM; the canvas is only the sand backdrop and the confetti.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.undoTime is CONFIG.undoTime.value
const STEP = 1 / 60;
let W = 1280, H = 720;
let stoneCache = null; // the sand backdrop, drawn once per size and theme
const TITLE = 'حقل الألغام';
const CONTROLS = ['الفأرة أو اللمس: كل شيء', '1-4: اختيار الإجابة (وفي الأسرع: رقم الفريق حتى 6)', 'Enter: الزر الرئيسي', 'P: إيقاف مؤقت · M: كتم الصوت', 'H: إخفاء النقاط', 'Z: تراجع', 'Esc: إغلاق النوافذ'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
const R = HaqlRules;
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let vseed = 11; // decoration's own stream (confetti, sand grain), never the game's chance
function vrng() { vseed = (vseed + 0x6D2B79F5) | 0; let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const events = [];
const SIZES = [6, 7, 8, 10], BLASTS = [2, 4, 8];
const snap = (v, list) => list.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);
const ruleTune = () => ({ safePoints: settings.safePoints, minePenalty: settings.minePenalty, blast: settings.blast, // rules.js DEFAULT_TUNE, from the setup (its defaults from config.js)
  presetMaps: tune.presetMaps, suggestedMines: CONFIG.suggestedMines });

// ---- Screen ---------------------------------------------------------------------------
const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ui = document.getElementById('ui');
const ctx = canvas.getContext('2d');
function fit() { // the stage is always 1280 x 720 or wider; the page scales it
  const vw = innerWidth, vh = innerHeight, a = vw / vh;
  if (a >= 16 / 9) { H = 720; W = Math.round(720 * a); } else { W = 1280; H = Math.round(1280 / a); }
  const s = Math.min(vw / W, vh / H), r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); ctx.setTransform(r, 0, 0, r, 0, 0);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.transform = `translate(${Math.round((vw - W * s) / 2)}px, ${Math.round((vh - H * s) / 2)}px) scale(${s})`;
}
addEventListener('resize', () => { fit(); if (scene) drawFrame(); });
fit();

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const typing = () => document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
addEventListener('keydown', e => {
  startAudio();
  const nativeEnter = (e.code === 'Enter' || e.code === 'NumpadEnter') && e.target instanceof Element && e.target.closest('button, a');
  if (!e.repeat && !nativeEnter) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' && !typing()) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume; out.connect(ac.destination); audio = { ac, out };
  }

      h('div', { class: 'keywarn' }, 'أخفِ شاشة العرض أولاً: زر الإخفاء في جهاز العرض، أو Win+P ثم «شاشة الكمبيوتر فقط». في الرمز إجابات الأسئلة القادمة، ومن يصوّره من الجمهور يراها.'),
      box,
      h('div', { class: 'keybtns' }, show,
        remain > 0 ? B(`لاحقاً (بقي ${remain} في المفتاح)`, '', () => { state.keySnooze = state.turns; close(); }) : first ? B('لاحقاً', '', () => { state.keySnooze = state.turns; close(); }) : null));
  } else {
    const typed = ask.view === 'code' && codeOK();
    const shown = typed ? h('div', { class: 'codeview' }, ...holdToShowCode(), h('div', { class: 'addr', id: 'keyaddr' }, keyAddress()),
      h('div', {}, 'رمز المطابقة ', h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code))) : box;
    modal.append(...[h('div', { style: 'font-size:18px', id: 'keyrange' }, typed ? 'افتح هذا العنوان على جوالك واكتب رمز المفتاح:' : 'جارٍ تجهيز الرمز…'), shown,
      h('div', { class: 'keybtns' },
        B('تم المسح: أكمل المسابقة', 'pri', () => { state.keyTo = typed || keyBuilt?.small ? passEnd(ask.from) : ask.from + keyBuilt.count; close(); }, { 'data-primary': '1', disabled: !typed, id: 'keydone' }),
        typed ? null : B('QR أصغر', '', () => { state.keyAsk.cap = Math.max(5, Math.floor((keyBuilt?.count || 20) / 2)); keyBuilt = null; renderAll(); }, { id: 'keysmaller', disabled: true }),
        codeOK() ? B(typed ? 'أظهر QR' : 'أظهر رمز المفتاح بدل QR', '', () => { state.keyAsk.view = typed ? null : 'code'; renderAll(); }, { id: 'keyview' }) : null,
        B('رجوع (Esc)', 'ghost', () => { state.keyAsk.step = 1; renderAll(); })),
      ownBank() ? h('div', { class: 'muted', style: 'font-size:14px' }, 'الرمز المكتوب يعمل مع أسئلة اللعبة الأصلية فقط؛ مع أسئلتك استعمل رمز QR.') : null].filter(Boolean));
  }
  const cap = ask.cap || 400;
  if (!(ask.step === 2 && ask.view === 'code' && codeOK())) (keyBuilt && keyBuilt.from === ask.from && keyBuilt.cap === cap ? Promise.resolve(keyBuilt) : buildKey(ask.from, cap)).then(k => {
    if (state.keyAsk !== ask || !modal.isConnected) return;
    if (!k) { box.replaceChildren(h('b', { style: 'color:var(--bg)' }, 'تعذّر صنع الرمز. ارفع keyMaxVersion في config.js.')); return; }
    keyBuilt = Object.assign(k, { cap });
    box.innerHTML = k.svg;
    if (ask.step === 1) { show.disabled = false; return; }
    document.getElementById('keyrange').replaceChildren(k.small ? 'امسح الرمز بجوالك: مفتاح كامل لأسئلة اللعبة · رمز المطابقة ' : `امسح الرمز بجوالك: الأسئلة ${ask.from + 1} إلى ${ask.from + k.count} · رمز المطابقة `, h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code));
    document.getElementById('keydone').disabled = false;
    const sm = document.getElementById('keysmaller'); if (sm) { sm.hidden = !!k.small; sm.disabled = k.count <= 10; }
  });
  ui.append(h('div', { class: 'ov', id: 'hostkey', 'data-step': String(ask.step), 'data-from': String(ask.from), 'data-cap': String(ask.cap || 0), 'data-view': ask.view || '', role: 'dialog', 'aria-label': 'مفتاح الإجابات للمقدّم' }, modal));
}

// ---- The host window (setup: شاشة المقدّم → نافذة على هذا الحاسوب; projector set to Extend) ----
// presenter.html stays on the laptop screen and shows the answer; this window is the only holder of the game. It sends a
// full snapshot on every render and every second; the host window sends back the same actions as the keyboard or the judge buttons.
let presenter = null;
const presenterOpen = () => !!presenter && !presenter.closed;
function openPresenter() {
  closeHostMenu();
  if (presenterOpen()) { presenter.focus(); return; }
  presenter = window.open('presenter.html', 'haql-presenter', 'popup,width=960,height=720');
  if (!presenter) setTimeout(() => { if (scene === 'play') { state.msg = 'منع المتصفح نافذة المقدّم. اسمح بالنوافذ المنبثقة لهذه الصفحة، ثم اضغط «افتح شاشة المقدّم» من ⋯ في الأعلى.'; renderAll(); } }, 0);
  else if (scene === 'play') renderHeader();
}
let adoptAsk = null;
function adoptPresenter() { const w = adoptAsk; adoptAsk = null; if (w && !w.closed) { presenter = w; tellPresenter(); } }
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (adoptAsk && !presenterOpen()) adoptPresenter(); }, true);
function tellPresenter() {
  if (!presenterOpen()) return;
  const playing = scene === 'play' && state, q = playing && state.q, p = playing ? state.phase : '';
  const asking = (p === 'question' || p === 'reveal') && q;
  const primary = ui.querySelector('[data-primary]:not([disabled])');
  const ti = !playing ? -1 : asking ? (state.answeredBy ?? state.cur) : state.cur;
  const ctx = p === 'act' ? 'يختار الفريق مربعاً مغلقاً ليفتحه.' : p === 'ready' ? state.last : p === 'blast' ? 'انفجر لغم!' : '';
  presenter.postMessage({ type: 'state', scene, phase: p, paused: playing ? state.paused : false,
    round: playing ? state.round : 0, team: playing ? state.names[state.cur] : '', teamNo: ti + 1, teamColor: ti >= 0 ? TEAM_HEX[ti] : '',
    answering: asking && state.answeredBy != null ? state.names[state.answeredBy] : '',
    q: asking ? (q.own ? { n: 0, own: true } : { n: q.n, text: q.text, answer: q.choices[q.right], right: q.right + 1, choices: q.choices }) : null,
    qmode: settings.qmode, done: p === 'reveal', result: p === 'reveal' ? state.result : null, undo: undo && (p === 'reveal') ? Math.max(0, Math.ceil(undo.until - state.t)) : 0,
    timer: asking ? Math.ceil(state.timer) : null, ctx, acts: [],
    primary: primary ? primary.textContent.trim() : '', judge: !!ui.querySelector('[data-judge="right"]:not([disabled])') }, '*');
}
setInterval(() => {
  tellPresenter();
  if (scene === 'play' && hostMode() === 'window') {
    const b = [...(refs.header?.querySelectorAll('button') || [])].find(x => x.textContent.includes('شاشة المقدّم'));
    if (b && b.textContent !== (presenterOpen() ? 'شاشة المقدّم: متصلة' : 'افتح شاشة المقدّم')) renderHeader();
  }
}, 1000);
addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'hello' && !presenterOpen()) { try { if (e.source && e.source !== window && e.source.name === 'haql-presenter') adoptAsk = e.source; } catch { if (location.protocol === 'file:') adoptAsk = e.source; } return; }
  if (!presenterOpen() || e.source !== presenter) return;
  if (m.type === 'hello') return tellPresenter();
  if (m.type !== 'cmd' || scene !== 'play') return;
  if (m.cmd === 'pause') { state.paused = !state.paused; renderHeader(); return; }
  if (state.paused) return;
  if (m.cmd === 'enter') hit.add('Enter');
  else if (m.cmd === 'choice' && m.k >= 1 && m.k <= 4) hit.add('Digit' + m.k);
  else if (m.cmd === 'judge' && (m.v === 'right' || m.v === 'wrong')) ui.querySelector(`[data-judge="${m.v}"]:not([disabled])`)?.click();
  else if (m.cmd === 'undo') undoLast();
});

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get settings() { return settings; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) step(); if (draw) drawFrame(); },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
// ---- Intro: the logo lockup for introTime seconds on load (config.js); any key or click skips it ----
function intro() {
  if (!tune.introTime || params.get('manual') === '1') return;
  const el = h('div', { id: 'intro', 'aria-hidden': 'true', style: `--t:${tune.introTime}s` }, h('img', { src: logoSrc('lockup-horizontal'), alt: '', 'data-logo': 'lockup-horizontal', onerror: e => { e.target.style.visibility = 'hidden'; } }));
  const end = () => { removeEventListener('keydown', skip, true); removeEventListener('pointerdown', skip, true); el.remove(); };
  const skip = e => {
    if (!el.isConnected) return end();
    e.preventDefault(); e.stopImmediatePropagation();
    if (!el.classList.contains('i-skip')) { el.classList.add('i-skip'); setTimeout(end, 200); }
  };
  addEventListener('keydown', skip, true); addEventListener('pointerdown', skip, true);
  setTimeout(end, tune.introTime * 1000);
  document.body.append(el);
}
intro();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
