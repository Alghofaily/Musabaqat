<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: is a quiz that decides who takes land more tense than plain points? -->
<!-- Date: 2026-11-19 -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>حصون المعرفة</title>
<style>
  @font-face { font-family: 'Plex'; font-weight: 500; src: url(vendor/plex-arabic-500.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Plex'; font-weight: 700; src: url(vendor/plex-arabic-700.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Plex'; font-weight: 500; src: url(vendor/plex-latin-500.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Plex'; font-weight: 700; src: url(vendor/plex-latin-700.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Kufi'; font-weight: 400 700; font-display: swap; src: url(vendor/reem-kufi.woff2) format('woff2'); }
  .dark { --logo-a: #c9a24a; --logo-b: #f4ecd8; --logo-ink: #f4ecd8; --bg: #0e1624; --sea: #0a111d; --wave: rgba(201,162,74,.10); --panel: #162133; --panel2: #111a29; --line: #26344d; --text: #e8e6df; --muted: #96a2b6;
    --brass: #c9a24a; --brass-ink: #1b1406; --hover: #1c2940; --land: #24324a; --ok: #3fb27f; --bad: #ef5a5f; --okbg: rgba(63,178,127,.15); --badbg: rgba(239,90,95,.14); --okfill: #1e7f55; --badfill: #c23a3f; --stone: #d8cdb2; --stone2: #a89c80; --shade: rgba(4,8,16,.55); }
  .light { --logo-a: #0e1624; --logo-b: #8a6a22; --logo-ink: #0e1624; --bg: #f4ecd8; --sea: #e3d6b6; --wave: rgba(120,90,30,.16); --panel: #fbf6ea; --panel2: #f1e7cf; --line: #d8c8a0; --text: #2a2a2a; --muted: #6b6250;
    --brass: #8a6a1f; --brass-ink: #fffaf0; --hover: #efe3c6; --land: #eadcb9; --ok: #1f7a4f; --bad: #b4232a; --okbg: rgba(31,122,79,.12); --badbg: rgba(180,35,42,.10); --okfill: #1f7a4f; --badfill: #b4232a; --stone: #b9ab8a; --stone2: #8c7f61; --shade: rgba(60,45,15,.35); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Plex', Tahoma, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; font-weight: 500; font-variant-numeric: tabular-nums; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--text); }
  #game { position: absolute; inset: 0; width: 1280px; height: 720px; }
  #ui { position: absolute; inset: 0; direction: rtl; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none; min-height: 40px; box-sizing: border-box; }
  input:focus { border-color: var(--brass); }
  .num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); } .brass { color: var(--brass); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
  .btn { padding: 10px 18px; min-height: 44px; font-weight: 700; font-size: 16px; background: var(--panel2); border: 1px solid var(--line); }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn.pri { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
  .btn.pri:hover:not(:disabled) { filter: brightness(1.1); background: var(--brass); }
  .btn.good { background: var(--okfill); color: #fff; border-color: transparent; }
  .btn.warn { background: var(--badfill); color: #fff; border-color: transparent; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); }
  .btn.ghost.danger { color: var(--bad); }
  .btn:disabled { opacity: .35; cursor: default; }
  .seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button { padding: 7px 14px; min-height: 38px; background: transparent; font-size: 14px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--brass); color: var(--brass-ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .chip.bad { border-color: var(--bad); }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .pop { animation: pop .5s ease-out; display: inline-block; }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ov { position: absolute; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; min-width: 380px; display: grid; gap: 14px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
  ::selection { background: var(--brass); color: var(--brass-ink); }

  /* the war room */
  header { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); box-sizing: border-box; }
  header .sp { flex: 1; }
  header .btn { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  .hgroup { display: flex; gap: 2px; align-items: center; padding-inline-start: 8px; border-inline-start: 1px solid var(--line); }
  #mapbox { position: absolute; left: 8px; top: 64px; width: 842px; height: 648px; cursor: pointer; }
  #side { position: absolute; right: 8px; top: 64px; width: 414px; height: 648px; display: flex; flex-direction: column; gap: 8px; }
  #side > .panel { display: flex; flex-direction: column; }
  /* B: a battle takes the whole stage; the panel slides off to the right and comes back for market, attack and move */
  #side { transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1), opacity .3s; }
  #side.gone { transform: translateX(440px); opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #side { transition: opacity .2s; } #side.gone { transform: none; } }
  .turn { padding: 12px 14px; display: grid; gap: 10px; }
  .turn .who { display: flex; align-items: center; gap: 12px; }
  .turn .who b { font-size: 26px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: grid; gap: 2px; }
  .stat small { color: var(--muted); font-size: 16px; white-space: nowrap; } .stat b { font-size: 19px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .steps span { text-align: center; padding: 5px 0; border-radius: 4px; font-size: 16px; font-weight: 700; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); }
  .steps span.on { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
  .steps span.done { color: var(--text); }
  .steps span.next { color: var(--text); border: 1px dashed var(--brass); } /* the question is answered: this step comes next */
  .act { flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .act .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .act .hint { font-size: 16px; line-height: 1.6; }
  .act .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .act .bottom { flex: none; display: flex; gap: 8px; }
  .act .bottom .btn { flex: 1 1 auto; white-space: nowrap; padding-inline: 10px; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .vs .side { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 14px; }
  .vs .side b { font-size: 16px; }
  .vs .side .n { font-size: 30px; font-weight: 700; }
  .vs .x { font-size: 22px; font-weight: 700; color: var(--brass); }
  .msg { min-height: 20px; font-size: 14px; font-weight: 700; }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button { width: 44px; height: 44px; font-size: 22px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
  .stepper b { min-width: 46px; text-align: center; font-size: 24px; }
  .stepper .stepn { width: 72px; height: 44px; text-align: center; font: inherit; font-size: 24px; font-weight: 700; direction: ltr; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .stepper .stepn:focus-visible { outline: 3px solid var(--brass); outline-offset: 1px; }
  table.lb { width: 100%; border-collapse: collapse; font-size: 18px; }
  table.lb th { color: var(--muted); font-weight: 500; font-size: 16px; text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.lb td { padding: 0 8px; height: 36px; border-bottom: 1px solid var(--line); }
  table.lb td .tn { font-size: 16px; }
  table.lb tr:last-child td { border-bottom: 0; }
  table.lb tr.cur { background: var(--hover); box-shadow: inset -3px 0 0 var(--brass); }
  table.lb tr.out td { color: var(--muted); text-decoration: line-through; }
  .tn { display: flex; gap: 7px; align-items: center; font-weight: 700; white-space: nowrap; min-width: 0; max-width: 150px; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #side > .panel.mini { flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 6px; }
  .mini > div { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 6px; background: var(--panel2); font-size: 18px; font-weight: 700; }
  .mini .nm { flex: 1; font-size: 16px; }
  .mini > div.cur { outline: 2px solid var(--brass); outline-offset: -2px; }
  .mini > div.out { color: var(--muted); text-decoration: line-through; }

  /* the question, over the map */
  #qpanel { position: absolute; left: 8px; top: 320px; width: 842px; height: 392px; display: flex; flex-direction: column; z-index: 5; animation: rise .3s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box; box-shadow: 0 -10px 28px rgba(0,0,0,.35); }
  #qpanel .ph { padding: 7px 14px; }
  #qpanel.battle { border-width: 3px; }
  #qpanel.leave { animation: sink .25s cubic-bezier(0.7, 0, 0.84, 0) both; }
  @keyframes sink { to { transform: translateY(110%); opacity: 0; } }
  /* A: who answers now, large enough for the back of the room */
  .answering { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .answering small { display: block; font-size: 16px; color: var(--muted); line-height: 1.1; }
  .answering b { display: block; font-size: 34px; line-height: 1.15; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sides { display: flex; gap: 14px; align-items: center; font-size: 16px; font-weight: 700; }
  .sides > span { display: flex; gap: 6px; align-items: center; }
  .sides .nm { max-width: 130px; }
  .sides .n { font-size: 26px; } .sides .x { color: var(--brass); } .sides .muted { font-weight: 500; }
  #qpanel .body { flex: 1; padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .q { font-size: 27px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
  .qno { flex: none; min-width: 72px; display: grid; justify-items: center; padding-inline-start: 14px; border-inline-start: 1px solid var(--line); }
  .qno small { font-size: 18px; color: var(--muted); font-weight: 700; }
  .qno b { font-size: 40px; line-height: 1.1; color: var(--text); }
  .seg[aria-disabled] button { opacity: .5; cursor: not-allowed; } /* off with four choices: the game judges itself */
  .keymodal { width: 760px; justify-items: center; }
  .keywarn { font-size: 19px; font-weight: 700; color: var(--bad); line-height: 1.6; max-width: 640px; }
  .qrbox { background: #fff; padding: 10px; border-radius: 8px; line-height: 0; width: 400px; height: 400px; display: grid; place-items: center; overflow: hidden; }
  .qrbox svg { width: 100%; height: 100%; transition: filter .25s ease-out; }
  .qrbox.veiled svg { filter: blur(16px); } /* unreadable by any camera until the host says the projector is hidden */
  .keybtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip.keychip { font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: default; }
  .chip.keychip:not([disabled]) { cursor: pointer; } .chip.keychip:not([disabled]):hover { color: var(--text); border-color: var(--brass); }
  .chip.keychip b { color: var(--text); letter-spacing: 1px; }
  .chip.keychip.near { border-color: var(--brass); color: var(--brass); }
  .chip.keychip .take { color: var(--brass); text-decoration: underline; text-underline-offset: 3px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; max-height: 150px; grid-auto-rows: 1fr; }
  .choice { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-weight: 700; font-size: 21px; text-align: right; min-height: 56px; }
  .choice .mark { margin-inline-start: auto; flex: none; }
  .choice.right .mark { color: var(--ok); } .choice.wrong .mark { color: var(--bad); }
  .choice:hover:not(:disabled) { border-color: var(--brass); }
  .choice .k { flex: none; width: 36px; height: 36px; border-radius: 6px; background: var(--line); display: grid; place-items: center; font-size: 17px; }
  .choice.right { background: var(--okbg); border-color: var(--ok); } .choice.wrong { background: var(--badbg); border-color: var(--bad); }
  .choice:disabled { cursor: default; }
  #qpanel[data-size=m] .q { font-size: 23px; } #qpanel[data-size=m] .choice { font-size: 18px; min-height: 50px; }
  #qpanel[data-size=l] .q { font-size: 19px; line-height: 1.4; } #qpanel[data-size=l] .choice { font-size: 16px; min-height: 44px; padding: 6px 12px; }
  .answer { padding: 10px 16px; border-radius: 8px; background: var(--okbg); border: 1px solid var(--ok); font-weight: 700; font-size: 22px; }
  .answer[hidden] { display: none; }
  .loss { font-size: 76px; font-weight: 700; color: var(--text); line-height: .9; } /* C: whose loss it is reads from the banner beside it, not from red */
  .fallen { font-family: 'Kufi', 'Plex', sans-serif; font-size: 46px; font-weight: 700; line-height: 1.1; }
  .lossnote { display: grid; gap: 2px; font-size: 16px; color: var(--muted); }
  .lossnote b { color: var(--text); font-size: 18px; white-space: nowrap; }
  .ring { position: relative; flex: none; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
  .duelrow { display: grid; grid-template-columns: 210px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .duelrow .who { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 17px; }
  .duelrow .who small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .picks { display: flex; gap: 8px; justify-content: flex-start; }
  .picks button { min-width: 64px; min-height: 48px; font-size: 20px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); }
  .picks button.on { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
  .picks button.right { background: var(--okfill); color: #fff; } .picks button.wrong { background: var(--badfill); color: #fff; }
  .verdict { font-size: 32px; font-weight: 700; }
  .reward { font-size: 54px; font-weight: 700; color: var(--brass); line-height: 1; }

  /* a capital falls: one full-stage beat */
  #fallbeat { z-index: 30; flex-direction: column; gap: 14px; background: rgba(4,8,16,.82); cursor: pointer; }
  .light #fallbeat { background: rgba(60,45,15,.7); }
  #fallbeat .scene { position: relative; width: 260px; height: 220px; }
  #fallbeat .fort { position: absolute; left: 40px; top: 30px; animation: crumble 1.1s cubic-bezier(0.5, 0, 0.75, 0) .15s both; }
  #fallbeat .old { position: absolute; left: 160px; top: 0; transform-origin: 30% 95%; animation: topple .55s cubic-bezier(0.5, 0, 0.75, 0) .1s both; }
  #fallbeat .new { position: absolute; left: 96px; top: 40px; animation: plant .5s cubic-bezier(0.16, 1, 0.3, 1) .95s both; }
  #fallbeat .head { font-family: 'Kufi', 'Plex', sans-serif; font-size: 64px; font-weight: 700; color: #f4ecd8; line-height: 1.2; }
  #fallbeat .sub { font-size: 22px; color: #e8e6df; }
  @keyframes crumble { 0% { transform: none; clip-path: inset(0 0 0 0); } 12% { transform: translateX(-5px); } 24% { transform: translateX(5px); } 34% { transform: translateX(-3px); clip-path: inset(0 0 0 0); } 100% { transform: translateY(90px); clip-path: inset(0 0 72% 0); opacity: .55; } }
  @keyframes topple { to { transform: rotate(-80deg); opacity: 0; } }
  @keyframes plant { from { transform: translateY(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
  .winhead { font-family: 'Kufi', 'Plex', sans-serif; font-size: 68px; font-weight: 700; line-height: 1.15; display: flex; align-items: center; gap: 18px; animation: rise .5s cubic-bezier(0.16, 1, 0.3, 1) 2.1s both; text-wrap: balance; }
  .place { animation: rise .5s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .tie { font-size: 13px; font-weight: 700; color: var(--brass); border: 1px solid var(--brass); border-radius: 4px; padding: 1px 6px; margin-inline-start: 6px; }
  .toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 18px; background: var(--panel); border: 1px solid var(--brass); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-weight: 700; animation: rise .25s cubic-bezier(0.16, 1, 0.3, 1); }
  #phone { display: none; position: fixed; left: 10px; right: 10px; top: 10px; z-index: 50; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; direction: rtl; font: 500 15px 'Plex', Tahoma, sans-serif; background: #162133; color: #e8e6df; border: 1px solid #c9a24a; }
  #phone button { margin-inline-start: auto; min-height: 40px; padding: 6px 12px; background: #c9a24a; color: #1b1406; font-weight: 700; }
  @media (max-width: 699px) and (orientation: portrait) { #phone:not([hidden]) { display: flex; } }

  /* title, setup, bank, results */
  .screen { position: absolute; inset: 0; padding: 20px 40px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .field input { width: 120px; direction: ltr; text-align: center; font-size: 16px; font-weight: 700; }
  .box { padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
  .box h3 { margin: 0; font-size: 16px; }
  .names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .names input { width: 100%; direction: rtl; text-align: right; font-size: 14px; }
  .banklist { overflow: auto; flex: 1; min-height: 0; }
  .bq { display: grid; grid-template-columns: 110px 1fr 190px 70px; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .addq { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 8px; }
  .addq input { direction: rtl; text-align: right; }
  /* Intro: the two pages of the Book Wall close like ramparts, then the name is written in, right to left.
     Every timing is a share of --t (config introTime), so one value sets the whole length. */
  #intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 4vmin; background: var(--bg); animation: intro-out var(--t) linear both; }
  #intro.i-skip { animation: intro-skip .2s linear both; }
  #intro .i-mk { width: 26vmin; height: auto; overflow: visible; animation: husun-thud var(--t) both; }
  #intro .i-pg { transform-box: fill-box; }

    document.getElementById('keysmaller').disabled = k.count <= 10;
  });
  ui.append(h('div', { class: 'ov', id: 'hostkey', 'data-step': String(ask.step), 'data-from': String(ask.from), 'data-cap': String(ask.cap || 0), role: 'dialog', 'aria-label': 'مفتاح الإجابات للمقدّم' }, modal));
}

// ---- The host window (setup: شاشة المقدّم → نافذة على هذا الحاسوب; projector set to Extend) ----
// presenter.html stays on the laptop screen and shows the answer; this window, on the projector, is
// the only holder of the game. It sends a full snapshot on every render and every second; the host
// window sends back the same actions as the keyboard (Enter, 1–4) or the judge buttons, so each one
// works only where it already would. window.open + postMessage also work from file:// (a flash drive).
let presenter = null;
const presenterOpen = () => !!presenter && !presenter.closed;
function openPresenter() { // from a click only: browsers block pop-ups opened any other way
  if (presenterOpen()) { presenter.focus(); return; }
  presenter = window.open('presenter.html', 'husun-presenter', 'popup,width=960,height=720');
  if (!presenter) setTimeout(() => { if (scene === 'play') { state.msg = 'منع المتصفح نافذة المقدّم. اسمح بالنوافذ المنبثقة لهذه الصفحة، ثم اضغط «افتح شاشة المقدّم» في الأعلى.'; state.msgGood = false; renderAll(); } }, 0);
  else if (scene === 'play') renderHeader();
}
function tellPresenter() {
  if (!presenterOpen()) return;
  const playing = scene === 'play' && state, q = playing && state.q, p = playing ? state.phase : '';
  const asking = ['question', 'reveal', 'duel', 'duelReveal'].includes(p) && q;
  const d = state && state.duel, duel = p === 'duel' || p === 'duelReveal';
  const who = !asking ? null : duel ? (p === 'duelReveal' && d.last ? (d.neutral || d.last.side === 'a' ? d.a : d.d) : answerer(d)) : state.cur;
  const primary = (document.getElementById('fallbeat') || ui).querySelector('[data-primary]:not([disabled])');
  presenter.postMessage({ type: 'state', scene, phase: p, paused: playing ? state.paused : false,
    round: playing ? state.round : 0, team: playing ? state.names[state.cur] : '', answering: who == null ? '' : state.names[who],
    q: asking ? { n: q.n, text: q.text, answer: q.choices[q.right], right: q.right + 1, choices: q.choices } : null,
    qmode: settings.qmode, done: p === 'reveal' || p === 'duelReveal', timer: asking ? Math.ceil(state.timer) : null,
    primary: primary ? primary.textContent.trim() : '', judge: !!document.querySelector('#qpanel [data-judge]') }, '*');
}
setInterval(() => { // the snapshot's timer, and the header's "connected" label when the host window opens or closes
  tellPresenter();
  if (scene === 'play' && hostMode() === 'window') {
    const b = [...(refs.header?.querySelectorAll('button') || [])].find(x => x.textContent.includes('شاشة المقدّم'));
    if (b && b.textContent !== (presenterOpen() ? 'شاشة المقدّم: متصلة' : 'افتح شاشة المقدّم')) renderHeader();
  }
}, 1000);
addEventListener('message', e => {
  if (!presenterOpen() || e.source !== presenter) return; // only the window this game opened
  const m = e.data || {};
  if (m.type === 'hello') return tellPresenter();
  if (m.type !== 'cmd' || scene !== 'play' || state.paused) return;
  if (m.cmd === 'enter') hit.add('Enter');
  else if (m.cmd === 'choice' && m.k >= 1 && m.k <= 4) hit.add('Digit' + m.k);
  else if (m.cmd === 'judge' && (m.v === 'right' || m.v === 'wrong')) document.querySelector(`#qpanel [data-judge="${m.v}"]`)?.click();
});

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
// ---- Intro: the logo for introTime seconds on load (config.js); any key or click skips it ----
function intro() {
  if (!tune.introTime || params.get('manual') === '1') return;
  const el = h('div', { id: 'intro', 'aria-hidden': 'true', style: `--t:${tune.introTime}s`, html:
    `<svg class="i-mk" viewBox="0 0 256 256"><g class="i-pg i-a"><path d="${BOOK_PAGE}" fill="var(--logo-a)"/></g>` +
    `<g class="i-pg i-b"><path d="${BOOK_PAGE}" fill="var(--logo-b)" transform="matrix(-1 0 0 1 256 0)"/></g></svg>` +
    `<div class="i-wm">${WORDMARK('100%')}</div>` });
  const end = () => { removeEventListener('keydown', skip, true); removeEventListener('pointerdown', skip, true); el.remove(); };
  const skip = e => { // capture phase: the key or click that skips never reaches the game
    if (!el.isConnected) return end(); // intro already gone: stop listening, let the key through
    e.preventDefault(); e.stopImmediatePropagation();
    if (!el.classList.contains('i-skip')) { el.classList.add('i-skip'); setTimeout(end, 200); }
  };
  addEventListener('keydown', skip, true); addEventListener('pointerdown', skip, true);
  setTimeout(end, tune.introTime * 1000);
  document.body.append(el);
}
intro();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
