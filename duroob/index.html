  if (!(ask.step === 2 && ask.view === 'code' && codeOK())) (keyBuilt && keyBuilt.from === ask.from && keyBuilt.cap === cap ? Promise.resolve(keyBuilt) : buildKey(ask.from, cap)).then(k => {
    if (state.keyAsk !== ask || !modal.isConnected) return;
    if (!k) { box.replaceChildren(h('b', { style: 'color:var(--bg)' }, 'تعذّر صنع الرمز. ارفع keyMaxVersion في config.js.')); return; }
    keyBuilt = Object.assign(k, { cap });
    box.innerHTML = k.svg;
    if (ask.step === 1) { show.disabled = false; return; }
    document.getElementById('keyrange').replaceChildren(k.small ? 'امسح الرمز بجوالك: مفتاح كامل لأسئلة اللعبة · رمز المطابقة ' : `امسح الرمز بجوالك: الأسئلة ${ask.from + 1} إلى ${ask.from + k.count} · رمز المطابقة `, h('b', { class: 'num', style: 'letter-spacing:3px' }, state.code));
    document.getElementById('keydone').disabled = false;
    const sm = document.getElementById('keysmaller'); if (sm) { sm.hidden = !!k.small; sm.disabled = k.count <= 10; }
  });
  ui.append(h('div', { class: 'ov', id: 'hostkey', 'data-step': String(ask.step), 'data-from': String(ask.from), 'data-cap': String(ask.cap || 0), 'data-view': ask.view || '', role: 'dialog', 'aria-label': 'مفتاح الإجابات للمقدّم' }, modal));
}

// ---- The host window (setup: شاشة المقدّم → نافذة على هذا الحاسوب; projector set to Extend) ----
// presenter.html stays on the laptop screen and shows the answer; this window is the only holder of the game. It sends a
// full snapshot on every render and every second; the host window sends back the same actions as the keyboard or the judge buttons.
let presenter = null;
const presenterOpen = () => !!presenter && !presenter.closed;
function openPresenter() {
  closeHostMenu();
  if (presenterOpen()) { presenter.focus(); return; }
  presenter = window.open('presenter.html', 'duroob-presenter', 'popup,width=960,height=720');
  if (!presenter) setTimeout(() => { if (scene === 'play') { state.msg = 'منع المتصفح نافذة المقدّم. اسمح بالنوافذ المنبثقة لهذه الصفحة، ثم اضغط «افتح شاشة المقدّم» من ⋯ في الأعلى.'; renderAll(); } }, 0);
  else if (scene === 'play') renderHeader();
}
let adoptAsk = null;
function adoptPresenter() { const w = adoptAsk; adoptAsk = null; if (w && !w.closed) { presenter = w; tellPresenter(); } }
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (adoptAsk && !presenterOpen()) adoptPresenter(); }, true);
function tellPresenter() {
  if (!presenterOpen()) return;
  const playing = scene === 'play' && state, q = playing && state.q, p = playing ? state.phase : '';
  const asking = (p === 'question' || p === 'reveal') && q;
  const primary = ui.querySelector('[data-primary]:not([disabled])');
  const ti = !playing ? -1 : asking ? (state.answeredBy ?? state.cur) : state.cur;
  const ctx = p === 'act' && state.act ? modeHint(state.act, state.g.teams[state.cur]) : p === 'ready' ? state.last : '';
  presenter.postMessage({ type: 'state', scene, phase: p, paused: playing ? state.paused : false,
    round: playing ? state.round : 0, team: playing ? state.names[state.cur] : '', teamNo: ti + 1, teamColor: ti >= 0 ? TEAM_HEX[ti] : '',
    answering: asking && state.answeredBy != null ? state.names[state.answeredBy] : '',
    q: asking ? (q.own ? { n: 0, own: true } : { n: q.n, text: q.text, answer: q.choices[q.right], right: q.right + 1, choices: q.choices }) : null,
    qmode: settings.qmode, done: p === 'reveal', result: p === 'reveal' ? state.result : null, undo: undo && (p === 'reveal') ? Math.max(0, Math.ceil(undo.until - state.t)) : 0,
    timer: asking ? Math.ceil(state.timer) : null, ctx, acts: [],
    primary: primary ? primary.textContent.trim() : '', judge: !!ui.querySelector('[data-judge="right"]:not([disabled])') }, '*');
}
setInterval(() => {
  tellPresenter();
  if (scene === 'play' && hostMode() === 'window') {
    const b = [...(refs.header?.querySelectorAll('button') || [])].find(x => x.textContent.includes('شاشة المقدّم'));
    if (b && b.textContent !== (presenterOpen() ? 'شاشة المقدّم: متصلة' : 'افتح شاشة المقدّم')) renderHeader();
  }
}, 1000);
addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'hello' && !presenterOpen()) { try { if (e.source && e.source !== window && e.source.name === 'duroob-presenter') adoptAsk = e.source; } catch { if (location.protocol === 'file:') adoptAsk = e.source; } return; }
  if (!presenterOpen() || e.source !== presenter) return;
  if (m.type === 'hello') return tellPresenter();
  if (m.type !== 'cmd' || scene !== 'play') return;
  if (m.cmd === 'pause') { state.paused = !state.paused; renderHeader(); return; }
  if (state.paused) return;
  if (m.cmd === 'enter') hit.add('Enter');
  else if (m.cmd === 'choice' && m.k >= 1 && m.k <= 4) hit.add('Digit' + m.k);
  else if (m.cmd === 'judge' && (m.v === 'right' || m.v === 'wrong')) ui.querySelector(`[data-judge="${m.v}"]:not([disabled])`)?.click();
  else if (m.cmd === 'undo') undoLast();
});

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

reset();
go(params.get('scene') || 'title');
last = clock.now();
// ---- Intro: the logo lockup for introTime seconds on load (config.js); any key or click skips it ----
// The lockup-stacked master inlined with its parts tagged for the intro; fills are the theme tokens, so it follows light and dark.
const INTRO_SVG = `<svg class="i-lk" viewBox="0 0 506 443"><g transform="translate(125.117 9)"><g fill="var(--text)"><rect class="i-tile" style="--i:5" x="41" y="41" width="50" height="50" rx="7"/><rect class="i-tile" style="--i:4" x="103" y="41" width="50" height="50" rx="7"/><rect class="i-tile" style="--i:3" x="165" y="41" width="50" height="50" rx="7"/><rect class="i-tile" style="--i:2" x="165" y="103" width="50" height="50" rx="7"/><rect class="i-tile" style="--i:0" x="103" y="165" width="50" height="50" rx="7"/><rect class="i-tile" style="--i:1" x="165" y="165" width="50" height="50" rx="7"/></g><g fill="var(--accent)"><circle class="i-lan" cx="66" cy="190" r="22"/></g></g><path class="i-wm" fill="var(--text)" transform="matrix(0.17778 0 0 0.17778 45.56 355.78)" d="M410 208Q386 208 369.0 191.0Q352 174 352 150Q352 126 369.0 109.0Q386 92 410 92Q434 92 451.0 109.0Q468 126 468 150Q468 174 451.0 191.0Q434 208 410 208ZM25 0 109 -140H685V0ZM605 0V-140H685V-309L825 -340V-23Q825 -11 815.0 -6.0Q805 -1 795.0 -0.5Q785 0 785 0ZM910 132Q967 147 1000.5 140.5Q1034 134 1050.0 116.0Q1066 98 1070.5 79.5Q1075 61 1075 52V-128L1215 -170V22Q1215.0 81.18333333333334 1190.0 118.59166666666667Q1165 156 1126.5 173.5Q1088 191 1045.5 191.0Q1003 191 966.5 175.5Q930 160 910 132ZM1215 -170 1046 -340Q1059 -340 1083.0 -341.5Q1107 -343 1133.5 -348.5Q1160 -354 1182.5 -365.5Q1205 -377 1215 -396ZM1046.26 0.0Q999.52 0.0 960.76 -23.0Q922 -46 898.5 -84.8125Q875.0 -123.625 875.0 -169.75Q875 -217 898.5091743119266 -255.72222222222223Q922.0183486238532 -294.44444444444446 961.0091743119266 -317.22222222222223Q1000 -340 1046.5 -340.0Q1093 -340 1131.0 -317.0Q1169 -294 1192.0 -255.6727272727273Q1215.0 -217.34545454545454 1215 -170Q1215 -123 1192.0 -84.5Q1169 -46 1131.0 -23.0Q1093 0 1046.26 0.0ZM1045.9859154929577 -140.0Q1059 -140 1067.0 -148.7Q1075.0 -157.4 1075 -170Q1075.0 -182.6 1067.0 -191.3Q1059 -200 1045.9859154929577 -200.0Q1032.9718309859154 -200.0 1023.9859154929577 -191.3Q1015.0 -182.6 1015 -170Q1015.0 -157.4 1023.9859154929577 -148.7Q1032.9718309859154 -140.0 1045.9859154929577 -140.0ZM1155 150Q1199 162 1227.5 159.0Q1256 156 1272.0 142.0Q1288 128 1294.0 106.5Q1300 85 1300 60V-309L1440 -340V60Q1440 113 1417.5 146.5Q1395 180 1359.0 195.5Q1323 211 1283.5 210.0Q1244 209 1209.5 193.5Q1175 178 1155 150ZM1490 0 1574 -140H2170Q2171 -167 2153.5 -183.5Q2136 -200 2080 -200H1600L1756 -460L1766 -453L1714 -340H2080Q2154 -340 2199.0 -319.0Q2244 -298 2267.5 -263.0Q2291 -228 2300.0 -186.0Q2309 -144 2309.5 -101.5Q2310 -59 2310 -23Q2310 -11 2300.0 -6.0Q2290 -1 2280.0 -0.5Q2270 0 2270 0Z"/></svg>`;
function intro() {
  if (!tune.introTime || params.get('manual') === '1') return;
  const el = h('div', { id: 'intro', 'aria-hidden': 'true', style: `--t:${tune.introTime}s`, html: INTRO_SVG });
  const end = () => { removeEventListener('keydown', skip, true); removeEventListener('pointerdown', skip, true); el.remove(); };
  const skip = e => {
    if (!el.isConnected) return end();
    e.preventDefault(); e.stopImmediatePropagation();
    if (!el.classList.contains('i-skip')) { el.classList.add('i-skip'); setTimeout(end, 200); }
  };
  addEventListener('keydown', skip, true); addEventListener('pointerdown', skip, true);
  setTimeout(end, tune.introTime * 1000);
  document.body.append(el);
}
intro();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
